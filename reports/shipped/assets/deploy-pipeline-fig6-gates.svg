<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" role="group" aria-label="Fig. 6: deploy, release and live registry, the per-merge era and today" style="width:100%;height:auto;max-width:760px;display:block" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <pattern id="grid6" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#e8f1fa" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <marker id="arr6" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c3d7ea"/></marker>
    <marker id="arm6" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#e8c56a"/></marker>
  </defs>
  <rect width="760" height="410" fill="#12395f"/>
  <rect width="760" height="410" fill="url(#grid6)"/>
  <rect x="0.5" y="0.5" width="759" height="409" fill="none" stroke="#68839d"/>
  <text x="746" y="24" font-size="10" letter-spacing="1.5" fill="#6f8fb0" text-anchor="end">TWO ERAS, ONE DEPLOY</text>
  <line x1="0" y1="36" x2="760" y2="36" stroke="#385a7b"/>
  <text x="20" y="62" font-size="10" letter-spacing="1.5" fill="#c3d7ea">08-12 TO 09-23 · A RELEASE PER MERGED PR</text>
<g>
  <rect x="20" y="74" width="118" height="70" fill="#21466a" stroke="#68839d"/>
  <text x="79.0" y="96" font-size="11" letter-spacing="1.5" fill="#e8f1fa" text-anchor="middle" font-weight="bold">DISPATCH</text>
  <text x="79.0" y="114" font-size="10" fill="#a7c0d9" text-anchor="middle">by hand,</text>
  <text x="79.0" y="128" font-size="10" fill="#a7c0d9" text-anchor="middle">any time</text>
</g>
<g>
  <rect x="170" y="74" width="150" height="70" fill="#21466a" stroke="#68839d"/>
  <text x="245.0" y="96" font-size="11" letter-spacing="1.5" fill="#e8f1fa" text-anchor="middle" font-weight="bold">DEPLOY</text>
  <text x="245.0" y="114" font-size="10" fill="#a7c0d9" text-anchor="middle">every dispatch</text>
  <text x="245.0" y="128" font-size="10" fill="#a7c0d9" text-anchor="middle">stamps GIT_SHA</text>
</g>
<g>
  <rect x="352" y="74" width="118" height="70" fill="#21466a" stroke="#68839d"/>
  <text x="411.0" y="96" font-size="11" letter-spacing="1.5" fill="#e8f1fa" text-anchor="middle" font-weight="bold">GATE 1</text>
  <text x="411.0" y="114" font-size="10" fill="#a7c0d9" text-anchor="middle">commit came from</text>
  <text x="411.0" y="128" font-size="10" fill="#a7c0d9" text-anchor="middle">a merged PR</text>
</g>
<g>
  <rect x="502" y="74" width="118" height="70" fill="#21466a" stroke="#68839d"/>
  <text x="561.0" y="96" font-size="11" letter-spacing="1.5" fill="#e8f1fa" text-anchor="middle" font-weight="bold">GATE 2</text>
  <text x="561.0" y="114" font-size="10" fill="#a7c0d9" text-anchor="middle">revision not</text>
  <text x="561.0" y="128" font-size="10" fill="#a7c0d9" text-anchor="middle">released yet</text>
</g>
<g>
  <rect x="652" y="74" width="88" height="70" fill="#21466a" stroke="#68839d"/>
  <text x="696.0" y="96" font-size="11" letter-spacing="1.5" fill="#e8f1fa" text-anchor="middle" font-weight="bold">RELEASE</text>
  <text x="696.0" y="114" font-size="10" fill="#a7c0d9" text-anchor="middle">+ alert</text>
</g>
<line x1="138" y1="109" x2="168" y2="109" stroke="#c3d7ea" stroke-width="1.5" marker-end="url(#arr6)"/>
<line x1="320" y1="109" x2="350" y2="109" stroke="#c3d7ea" stroke-width="1.5" marker-end="url(#arr6)"/>
<line x1="470" y1="109" x2="500" y2="109" stroke="#c3d7ea" stroke-width="1.5" marker-end="url(#arr6)"/>
<line x1="620" y1="109" x2="650" y2="109" stroke="#c3d7ea" stroke-width="1.5" marker-end="url(#arr6)"/>
  <line x1="0" y1="200" x2="760" y2="200" stroke="#385a7b"/>
  <text x="20" y="224" font-size="10" letter-spacing="1.5" fill="#c3d7ea">TODAY</text>
  <text x="262" y="224" font-size="10" letter-spacing="1.5" fill="#c3d7ea">A NOTICE PER DEPLOY, ONE RELEASE A WEEK</text>
<g>
  <rect x="170" y="238" width="150" height="70" fill="#21466a" stroke="#68839d"/>
  <text x="245.0" y="260" font-size="11" letter-spacing="1.5" fill="#e8f1fa" text-anchor="middle" font-weight="bold">LIVE REGISTRY</text>
  <text x="245.0" y="278" font-size="10" fill="#a7c0d9" text-anchor="middle">reads GIT_SHA back</text>
  <text x="245.0" y="292" font-size="10" fill="#a7c0d9" text-anchor="middle">from Cloudflare</text>
</g>
<g>
  <rect x="352" y="238" width="150" height="70" fill="#21466a" stroke="#68839d"/>
  <text x="427.0" y="260" font-size="11" letter-spacing="1.5" fill="#e8f1fa" text-anchor="middle" font-weight="bold">DRIFT LINE</text>
  <text x="427.0" y="278" font-size="10" fill="#a7c0d9" text-anchor="middle">only when the</text>
  <text x="427.0" y="292" font-size="10" fill="#a7c0d9" text-anchor="middle">estate is split</text>
</g>
<g>
  <rect x="552" y="238" width="188" height="70" fill="#21466a" stroke="#e8c56a"/>
  <text x="646.0" y="260" font-size="11" letter-spacing="1.5" fill="#e8c56a" text-anchor="middle" font-weight="bold">WEEKLY RELEASE</text>
  <text x="646.0" y="278" font-size="10" fill="#a7c0d9" text-anchor="middle">at the live commit</text>
  <text x="646.0" y="292" font-size="10" fill="#a7c0d9" text-anchor="middle">notes: PRs since the last</text>
</g>
<line x1="245" y1="146" x2="245" y2="236" stroke="#c3d7ea" stroke-width="1.5" marker-end="url(#arr6)"/>
<line x1="320" y1="273" x2="350" y2="273" stroke="#c3d7ea" stroke-width="1.5" marker-end="url(#arr6)"/>
<path d="M 245 310 L 245 336 L 646 336 L 646 310" fill="none" stroke="#e8c56a" stroke-width="1.5" marker-end="url(#arm6)"/>
  <text x="445" y="330" font-size="10" fill="#6f8fb0" text-anchor="middle">once a week, from the live commit</text>
  <line x1="0" y1="354" x2="760" y2="354" stroke="#385a7b"/>
  <text x="14" y="374" font-size="10" fill="#a7c0d9">The deploy posts a notice on every dispatch, with the merged PR and the drift line, and mints no tag.</text>
  <text x="14" y="392" font-size="10" fill="#6f8fb0">The registry reads the stamped commit off the platform, not out of a log.</text>
</svg>
