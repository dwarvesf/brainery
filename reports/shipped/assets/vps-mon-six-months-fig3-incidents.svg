<text x="201.5" y="95.5" font-size="9" fill="#c3d7ea" text-anchor="middle">F</text>
<circle cx="231.6" cy="92" r="6" fill="#12395f" stroke="#c3d7ea" stroke-width="1.5"/>
<text x="231.6" y="95.5" font-size="9" fill="#c3d7ea" text-anchor="middle">G</text>
<circle cx="363.1" cy="92" r="6" fill="#12395f" stroke="#c3d7ea" stroke-width="1.5"/>
<text x="363.1" y="95.5" font-size="9" fill="#c3d7ea" text-anchor="middle">H</text>
<circle cx="569.7" cy="92" r="6" fill="#12395f" stroke="#c3d7ea" stroke-width="1.5"/>
<text x="569.7" y="95.5" font-size="9" fill="#c3d7ea" text-anchor="middle">I</text>
<circle cx="611.0" cy="92" r="6" fill="#12395f" stroke="#c3d7ea" stroke-width="1.5"/>
<text x="611.0" y="95.5" font-size="9" fill="#c3d7ea" text-anchor="middle">J</text>
<circle cx="686.2" cy="92" r="6" fill="#12395f" stroke="#c3d7ea" stroke-width="1.5"/>
<text x="686.2" y="95.5" font-size="9" fill="#c3d7ea" text-anchor="middle">K</text>
<text x="24" y="150" font-size="10" letter-spacing="1.5" fill="#c3d7ea">WHAT EACH ONE WAS</text>
<text x="24" y="176" font-size="11" fill="#c3d7ea">A</text>
<text x="44" y="176" font-size="10" fill="#e8f1fa">request counter burns the KV quota</text>
<text x="44" y="190" font-size="9" fill="#6f8fb0">24 APR</text>
<text x="24" y="210" font-size="11" fill="#c3d7ea">B</text>
<text x="44" y="210" font-size="10" fill="#e8f1fa">retry buffer jams for good</text>
<text x="44" y="224" font-size="9" fill="#6f8fb0">24 APR</text>
<text x="24" y="244" font-size="11" fill="#c3d7ea">C</text>
<text x="44" y="244" font-size="10" fill="#e8f1fa">probe aimed at a private address</text>
<text x="44" y="258" font-size="9" fill="#6f8fb0">30 APR</text>
<text x="24" y="278" font-size="11" fill="#c3d7ea">D</text>
<text x="44" y="278" font-size="10" fill="#e8f1fa">dashboard denies everyone</text>
<text x="44" y="292" font-size="9" fill="#6f8fb0">6 MAY</text>
<text x="24" y="312" font-size="11" fill="#e8c56a">E</text>
<text x="44" y="312" font-size="10" fill="#e8c56a">a forgotten Worker starves the account</text>
<text x="44" y="326" font-size="9" fill="#6f8fb0">11 MAY</text>
<text x="24" y="346" font-size="11" fill="#c3d7ea">F</text>
<text x="44" y="346" font-size="10" fill="#e8f1fa">a second quota burn, same cause</text>
<text x="44" y="360" font-size="9" fill="#6f8fb0">2 JUN</text>
<text x="396" y="176" font-size="11" fill="#c3d7ea">G</text>
<text x="416" y="176" font-size="10" fill="#e8f1fa">edge probe loses packets, pages</text>
<text x="416" y="190" font-size="9" fill="#6f8fb0">10 JUN</text>
<text x="396" y="210" font-size="11" fill="#c3d7ea">H</text>
<text x="416" y="210" font-size="10" fill="#e8f1fa">empty docker output reads as down</text>
<text x="416" y="224" font-size="9" fill="#6f8fb0">15 JUL</text>
<text x="396" y="244" font-size="11" fill="#c3d7ea">I</text>
<text x="416" y="244" font-size="10" fill="#e8f1fa">three flappers, one real defect</text>
<text x="416" y="258" font-size="9" fill="#6f8fb0">8 SEP</text>
<text x="396" y="278" font-size="11" fill="#c3d7ea">J</text>
<text x="416" y="278" font-size="10" fill="#e8f1fa">one empty tick, three false pages</text>
<text x="416" y="292" font-size="9" fill="#6f8fb0">19 SEP</text>
<text x="396" y="312" font-size="11" fill="#c3d7ea">K</text>
<text x="416" y="312" font-size="10" fill="#e8f1fa">monitors drift from the estate</text>
<text x="416" y="326" font-size="9" fill="#6f8fb0">9 OCT</text>
<text x="24" y="392" font-size="9" fill="#a7c0d9">Amber marks E: both hosts went silent within 20 seconds of each other, for about 9.5 hours.</text>
</svg>
