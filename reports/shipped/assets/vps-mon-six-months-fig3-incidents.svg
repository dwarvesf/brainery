<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 404" role="group" aria-label="Fig. 3: the eleven incident write-ups on a dated axis" style="width:100%;height:auto;max-width:760px;display:block" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
