<g  data-fk-node="merge" data-tip="A post merges in brainery. The vault holds text; images go to the memo-vault-assets bucket after merge." data-animate="sequence" data-step="0">
  <rect x="250" y="52" width="260" height="64" fill="#21466a" stroke="#68839d" stroke-width="1"/>
  <text x="262" y="73" font-size="12" fill="#6f8fb0">1</text>
  <text x="282" y="72" font-size="9" letter-spacing="1.5" fill="#6f8fb0">BRAINERY MERGE</text>

  <text x="282" y="105" font-size="10" fill="#a7c0d9">text only; media goes to R2</text>
</g>
<g  data-fk-node="dispatch" data-tip="publish-on-push mints a short-lived token and dispatches the data plane and the frontend, both content-only." data-animate="sequence" data-step="1">

  <text x="282" y="191" font-size="10" fill="#a7c0d9">and starts both repos</text>
</g>
<g  data-fk-node="plane" data-tip="foundation-workers compiles the vault and writes D1 and R2. It never builds or deploys the frontend." data-animate="sequence" data-step="2">

  <text x="42" y="253" font-size="12" fill="#6f8fb0">3</text>

  <text x="62" y="270" font-size="10" fill="#e8f1fa">publish.sh: compile the vault</text>
  <text x="62" y="285" font-size="10" fill="#a7c0d9">seed D1, upload to R2, keep memo-api</text>
</g>
<g  data-fk-node="front" data-tip="foundation-apps builds the static export and deploys the df-memo Worker." data-animate="sequence" data-step="2">
  <rect x="430" y="232" width="300" height="72" fill="#21466a" stroke="#68839d" stroke-width="1"/>
  <text x="442" y="253" font-size="12" fill="#6f8fb0">4</text>

  <text x="462" y="270" font-size="10" fill="#e8f1fa">Deploy memo, target production</text>
  <text x="462" y="285" font-size="10" fill="#a7c0d9">Next.js static export, 3,078 pages</text>
</g>

  <text x="44" y="358" font-size="9" letter-spacing="1.5" fill="#6f8fb0">D1 + R2 + MEMO-API</text>
  <text x="44" y="376" font-size="10" fill="#e8f1fa">search, menus, identity, writer rows</text>
</g>
<g  data-fk-node="site" data-tip="The df-memo Worker serves the static pages and forwards /api over a service binding." data-animate="sequence" data-step="3">

  <text x="444" y="358" font-size="9" letter-spacing="1.5" fill="#6f8fb0">DF-MEMO WORKER</text>
  <text x="444" y="376" font-size="10" fill="#e8f1fa">serves the pages, routes /api</text>
</g>
<g  data-group="retired" data-tip="What this lane replaced: the Elixir compiler and the DuckDB parquet, which the TypeScript build and D1 took over.">

</g>

  <text x="444" y="432" font-size="9" letter-spacing="1.5" fill="#6f8fb0">WAS</text>
  <text x="444" y="450" font-size="10" fill="#e8f1fa">Cloudflare Pages project</text>
</g>
