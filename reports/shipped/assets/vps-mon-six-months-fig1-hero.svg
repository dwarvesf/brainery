<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 526" role="group" aria-label="Fig. 1: one Worker, three ways in, and who hears the alert" style="width:100%;height:auto;max-width:760px;display:block" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <pattern id="grid1" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M 26 0 L 0 0 0 26" fill="none" stroke="#e8f1fa" stroke-opacity="0.05" stroke-width="1"/></pattern>
    <marker id="ar1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c3d7ea"/></marker>
    <marker id="am1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e8c56a"/></marker>
  </defs>
  <rect width="760" height="526" fill="#12395f"/>
  <rect width="760" height="526" fill="url(#grid1)"/>
  <rect x="0.5" y="0.5" width="759" height="525" fill="none" stroke="#68839d"/>
  <text x="14" y="24" font-size="10" letter-spacing="1.5" fill="#c3d7ea">FIG. 1 · ONE WORKER, THREE WAYS IN</text>
  <text x="746" y="24" font-size="10" letter-spacing="1.5" fill="#6f8fb0" text-anchor="end">STATE OF 18 OCTOBER 2026</text>
  <line x1="0" y1="36" x2="760" y2="36" stroke="#385a7b"/>
<text x="24" y="60" font-size="10" letter-spacing="1.5" fill="#c3d7ea">WHAT WE WATCH</text>
<rect x="24" y="72" width="230" height="66" fill="#21466a" stroke="#68839d" stroke-width="1"/>
<text x="38" y="91" font-size="9" letter-spacing="1.5" fill="#6f8fb0">HOST AGENTS · 3</text>
<text x="38" y="109" font-size="10" fill="#e8f1fa">a VPS, a Mac Mini, a laptop</text>
<text x="38" y="124" font-size="10" fill="#a7c0d9">signed snapshot every 2 min</text>
<rect x="265" y="72" width="230" height="66" fill="#21466a" stroke="#e8c56a" stroke-width="1.5"/>
<text x="279" y="91" font-size="9" letter-spacing="1.5" fill="#e8c56a">JOB HEARTBEATS · 193</text>
<text x="279" y="109" font-size="10" fill="#e8f1fa">each job pings when it ends</text>
<text x="279" y="124" font-size="10" fill="#a7c0d9">silence is the alert</text>
<rect x="506" y="72" width="230" height="66" fill="#21466a" stroke="#68839d" stroke-width="1"/>
<text x="520" y="91" font-size="9" letter-spacing="1.5" fill="#6f8fb0">PULLS · 5 MIN, 6 H, DAILY</text>
<text x="520" y="109" font-size="10" fill="#e8f1fa">edge probes of host and URL</text>
<text x="520" y="124" font-size="10" fill="#a7c0d9">job lists from Cloudflare, launchd</text>
<line x1="139.0" y1="138" x2="139.0" y2="176" stroke="#c3d7ea" stroke-width="1.5" marker-end="url(#ar1)"/>
<line x1="380.0" y1="138" x2="380.0" y2="176" stroke="#e8c56a" stroke-width="1.5" marker-end="url(#am1)"/>
<line x1="621.0" y1="138" x2="621.0" y2="176" stroke="#c3d7ea" stroke-width="1.5" marker-end="url(#ar1)"/>
<rect x="24" y="178" width="712" height="140" fill="#12395f" stroke="#68839d"/>
<text x="38" y="198" font-size="10" letter-spacing="1.5" fill="#c3d7ea">ONE CLOUDFLARE WORKER, FREE PLAN</text>
<rect x="36" y="210" width="162" height="94" fill="#21466a" stroke="#68839d" stroke-width="1"/>
<text x="50" y="229" font-size="9" letter-spacing="1.5" fill="#6f8fb0">INGEST</text>
<text x="50" y="247" font-size="10" fill="#e8f1fa">check the HMAC</text>
<text x="50" y="262" font-size="10" fill="#a7c0d9">and a 120 s clock gate</text>
<rect x="210" y="210" width="162" height="94" fill="#21466a" stroke="#68839d" stroke-width="1"/>
<text x="224" y="229" font-size="9" letter-spacing="1.5" fill="#6f8fb0">SWEEP · EVERY 5 MIN</text>
<text x="224" y="247" font-size="10" fill="#e8f1fa">who went silent?</text>
<text x="224" y="262" font-size="10" fill="#a7c0d9">which probe failed?</text>
<rect x="384" y="210" width="162" height="94" fill="#21466a" stroke="#68839d" stroke-width="1"/>
<text x="398" y="229" font-size="9" letter-spacing="1.5" fill="#6f8fb0">RULES</text>
<text x="398" y="247" font-size="10" fill="#e8f1fa">grace period, then</text>
<text x="398" y="262" font-size="10" fill="#a7c0d9">dedup 15 min, 23 h</text>
<rect x="558" y="210" width="162" height="94" fill="#21466a" stroke="#68839d" stroke-width="1"/>
<text x="572" y="229" font-size="9" letter-spacing="1.5" fill="#6f8fb0">CATALOG</text>
<text x="572" y="247" font-size="10" fill="#e8f1fa">reconcile each job by</text>
<text x="572" y="262" font-size="10" fill="#a7c0d9">kind, not by name</text>
<line x1="139.0" y1="318" x2="139.0" y2="350" stroke="#c3d7ea" stroke-width="1.5" marker-end="url(#ar1)"/>
<line x1="380.0" y1="318" x2="380.0" y2="350" stroke="#c3d7ea" stroke-width="1.5" marker-end="url(#ar1)"/>
<line x1="621.0" y1="318" x2="621.0" y2="350" stroke="#c3d7ea" stroke-width="1.5" marker-end="url(#ar1)"/>
<text x="24" y="342" font-size="10" letter-spacing="1.5" fill="#c3d7ea">THREE STORES</text>
<rect x="24" y="356" width="230" height="56" fill="#21466a" stroke="#68839d" stroke-width="1"/>
<text x="38" y="375" font-size="9" letter-spacing="1.5" fill="#6f8fb0">D1</text>
<text x="38" y="393" font-size="10" fill="#e8f1fa">alerts, hosts, heartbeats</text>
<rect x="265" y="356" width="230" height="56" fill="#21466a" stroke="#68839d" stroke-width="1"/>
<text x="279" y="375" font-size="9" letter-spacing="1.5" fill="#6f8fb0">KV</text>
<text x="279" y="393" font-size="10" fill="#e8f1fa">dedup markers, probe counters</text>
<rect x="506" y="356" width="230" height="56" fill="#21466a" stroke="#68839d" stroke-width="1"/>
<text x="520" y="375" font-size="9" letter-spacing="1.5" fill="#6f8fb0">ANALYTICS ENGINE</text>
<text x="520" y="393" font-size="10" fill="#e8f1fa">per-host metrics, 90 days</text>
<text x="24" y="440" font-size="10" letter-spacing="1.5" fill="#c3d7ea">WHO HEARS IT</text>
<rect x="24" y="450" width="230" height="56" fill="#21466a" stroke="#68839d" stroke-width="1"/>
<text x="38" y="469" font-size="9" letter-spacing="1.5" fill="#6f8fb0">DISCORD</text>
<text x="38" y="487" font-size="10" fill="#e8f1fa">one channel per tenant</text>
<rect x="265" y="450" width="230" height="56" fill="#21466a" stroke="#68839d" stroke-width="1"/>
<text x="279" y="469" font-size="9" letter-spacing="1.5" fill="#6f8fb0">CATALOG PAGE</text>
<text x="279" y="487" font-size="10" fill="#e8f1fa">behind Cloudflare Access</text>
<rect x="506" y="450" width="230" height="56" fill="#21466a" stroke="#68839d" stroke-width="1"/>
<text x="520" y="469" font-size="9" letter-spacing="1.5" fill="#6f8fb0">SECOND INSTANCE</text>
<text x="520" y="487" font-size="10" fill="#e8f1fa">other account, pings both ways</text>
</svg>
