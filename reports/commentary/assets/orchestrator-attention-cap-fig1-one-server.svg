<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 404" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-labelledby="t d">
  <title id="t">Fig. 1 four agents, one queue, one human server</title>
  <desc id="d">Four agents each run alone for NT minutes, then join a single queue called needs you. One human, emphasised, serves the queue one at a time: review and steer (IT) plus re-orient (WT). The cap on useful agents is the minimum of fan-out, open loops of about 3 to 4, review rate, and energy.</desc>
  <defs>
    <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 .5H20M.5 0V20" fill="none" stroke="#edf0f4" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="760" height="404" fill="#eef1f4"/>
  <rect x="8" y="8" width="744" height="388" fill="#ffffff"/>
  <rect x="8" y="8" width="744" height="388" fill="url(#g)"/>
  <rect x="8.5" y="8.5" width="743" height="387" fill="none" stroke="#d3dae2"/>
  <text x="28" y="38" font-size="13.5" font-family="Archivo, 'Arial Narrow', 'Helvetica Neue', Arial, ui-monospace, monospace" font-weight="700" fill="#17212b">Agents are cheap, you are the server.</text>
  <text x="28" y="56" font-size="9.5" letter-spacing="1.2" font-weight="500" fill="#4e5b69">FIG. 1 · ONE SERVER</text>
  <line x1="8" y1="70" x2="752" y2="70" stroke="#d3dae2"/>

  <text x="40" y="94" font-size="9.5" letter-spacing="1.1" font-weight="500" fill="#4e5b69">CHEAP, PARALLEL</text>
  <rect x="40" y="102" width="190" height="46" rx="6" fill="#ffffff" stroke="#4e5b69" stroke-width="1.2"/>
  <text x="54" y="121" font-size="11.5" font-weight="600" fill="#17212b">agent A</text>
  <rect x="54" y="131" width="56" height="7" fill="#4e5b69" fill-opacity="0.35"/>
  <text x="118" y="138" font-size="10" fill="#4e5b69">runs alone (NT)</text>
  <line x1="230" y1="125" x2="293.4" y2="183.9" stroke="#4e5b69" stroke-width="1.3"/>
  <polygon points="300,190 289.6,186.5 295.7,179.9" fill="#4e5b69"/>
  <rect x="40" y="158" width="190" height="46" rx="6" fill="#ffffff" stroke="#4e5b69" stroke-width="1.2"/>
  <text x="54" y="177" font-size="11.5" font-weight="600" fill="#17212b">agent B</text>
  <rect x="54" y="187" width="56" height="7" fill="#4e5b69" fill-opacity="0.35"/>
  <text x="118" y="194" font-size="10" fill="#4e5b69">runs alone (NT)</text>
  <line x1="230" y1="181" x2="291.7" y2="206.6" stroke="#4e5b69" stroke-width="1.3"/>
  <polygon points="300,210 289,210.3 292.5,202" fill="#4e5b69"/>
  <rect x="40" y="214" width="190" height="46" rx="6" fill="#ffffff" stroke="#4e5b69" stroke-width="1.2"/>
  <text x="54" y="233" font-size="11.5" font-weight="600" fill="#17212b">agent C</text>
  <rect x="54" y="243" width="56" height="7" fill="#4e5b69" fill-opacity="0.35"/>
  <text x="118" y="250" font-size="10" fill="#4e5b69">runs alone (NT)</text>
  <line x1="230" y1="237" x2="291" y2="230.9" stroke="#4e5b69" stroke-width="1.3"/>
  <polygon points="300,230 290.5,235.5 289.6,226.5" fill="#4e5b69"/>
  <rect x="40" y="270" width="190" height="46" rx="6" fill="#ffffff" stroke="#4e5b69" stroke-width="1.2"/>
  <text x="54" y="289" font-size="11.5" font-weight="600" fill="#17212b">agent D</text>
  <rect x="54" y="299" width="56" height="7" fill="#4e5b69" fill-opacity="0.35"/>
  <text x="118" y="306" font-size="10" fill="#4e5b69">runs alone (NT)</text>
  <line x1="230" y1="293" x2="292.3" y2="254.7" stroke="#4e5b69" stroke-width="1.3"/>
  <polygon points="300,250 293.8,259.1 289.1,251.4" fill="#4e5b69"/>
  <text x="300" y="162" font-size="9.5" letter-spacing="1.1" font-weight="500" fill="#4e5b69">QUEUE</text>
  <rect x="300" y="170" width="150" height="100" rx="6" fill="#ffffff" stroke="#4e5b69" stroke-width="1.2"/>
  <text x="375" y="192" font-size="11.5" font-weight="600" fill="#17212b" text-anchor="middle">needs you</text>
  <rect x="322" y="204" width="28" height="24" rx="3" fill="#ffffff" stroke="#4e5b69" stroke-width="1.2"/>
  <text x="336" y="220.5" font-size="10.5" font-weight="500" fill="#17212b" text-anchor="middle">D</text>
  <rect x="361" y="204" width="28" height="24" rx="3" fill="#ffffff" stroke="#4e5b69" stroke-width="1.2"/>
  <text x="375" y="220.5" font-size="10.5" font-weight="500" fill="#17212b" text-anchor="middle">C</text>
  <rect x="400" y="204" width="28" height="24" rx="3" fill="#ffffff" stroke="#4e5b69" stroke-width="1.2"/>
  <text x="414" y="220.5" font-size="10.5" font-weight="500" fill="#17212b" text-anchor="middle">B</text>
  <text x="375" y="254" font-size="10" fill="#4e5b69" text-anchor="middle">waiting, idle</text>
  <line x1="450" y1="220" x2="511" y2="220" stroke="#4e5b69" stroke-width="1.3"/>
  <polygon points="520,220 510,224.5 510,215.5" fill="#4e5b69"/>
  <text x="485" y="212" font-size="9.5" fill="#4e5b69" text-anchor="middle">next</text>
  <text x="520" y="152" font-size="9.5" letter-spacing="1.1" font-weight="500" fill="#4e5b69">ONE SERVER</text>
  <rect x="520" y="160" width="200" height="120" rx="6" fill="#e2f0f8" stroke="#0a6aa1" stroke-width="1.6"/>
  <text x="620" y="187" font-size="12.5" letter-spacing="2" font-weight="700" fill="#0a6aa1" text-anchor="middle">YOU</text>
  <text x="620" y="213" font-size="11" fill="#17212b" text-anchor="middle">review + steer (IT)</text>
  <text x="620" y="231" font-size="11" fill="#17212b" text-anchor="middle">+ re-orient (WT)</text>
  <text x="620" y="259" font-size="10" fill="#4e5b69" text-anchor="middle">now serving: agent A</text>
  <path d="M 620.0 280 V 334 H 135 V 328" fill="none" stroke="#4e5b69" stroke-width="1.3" style="stroke-dasharray:4 3"/>
  <polygon points="135,318 139.5,328 130.5,328" fill="#4e5b69"/>
  <text x="380" y="329" font-size="9.5" fill="#4e5b69" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">steered, back to work alone</text>
  <line x1="28" y1="350" x2="732" y2="350" stroke="#d3dae2" stroke-width="1"/>
  <text x="380" y="380" font-size="12" font-weight="500" fill="#17212b" text-anchor="middle">cap = min( fan-out, open loops ~3-5, review rate, energy )</text>
</svg>
