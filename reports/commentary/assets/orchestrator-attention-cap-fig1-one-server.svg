<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-labelledby="t d">
  <title id="t">Fig. 1 four agents, one queue, one human server</title>
  <desc id="d">Four agents each run alone for NT minutes, then join a single queue called needs you. One human, highlighted, serves the queue one at a time: review and steer (IT) plus re-orient (WT). The cap on useful agents is the minimum of fan-out, open loops of about 3 to 4, review rate, and energy.</desc>
  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#e8f1fa" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c3d7ea"/>
    </marker>
    <marker id="arrdim" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6f8fb0"/>
    </marker>
  </defs>
  <rect width="760" height="344" fill="#12395f"/>
  <rect width="760" height="344" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="759" height="343" fill="none" stroke="#68839d"/>
  <text x="14" y="24" font-size="10" letter-spacing="1.5" fill="#c3d7ea">FIG. 1 · ONE SERVER</text>
  <text x="746" y="24" font-size="10" letter-spacing="1.5" fill="#6f8fb0" text-anchor="end">AGENTS ARE CHEAP, YOU ARE THE SERVER</text>
  <line x1="0" y1="36" x2="760" y2="36" stroke="#385a7b"/>

  <text x="40" y="54" font-size="9" letter-spacing="1.5" fill="#6f8fb0">CHEAP, PARALLEL</text>
  <rect x="40" y="62" width="190" height="46" fill="#21466a" stroke="#68839d"/>
  <text x="54" y="81" font-size="11" fill="#e8f1fa">agent A</text>
  <rect x="54" y="91" width="56" height="7" fill="#c3d7ea" stroke="none" fill-opacity="0.55"/>
  <text x="118" y="98" font-size="9" fill="#a7c0d9">runs alone (NT)</text>
  <line x1="230" y1="85" x2="298" y2="150" stroke="#c3d7ea" marker-end="url(#arr)"/>
  <rect x="40" y="116" width="190" height="46" fill="#21466a" stroke="#68839d"/>
  <text x="54" y="135" font-size="11" fill="#e8f1fa">agent B</text>
  <rect x="54" y="145" width="56" height="7" fill="#c3d7ea" stroke="none" fill-opacity="0.55"/>
  <text x="118" y="152" font-size="9" fill="#a7c0d9">runs alone (NT)</text>
  <line x1="230" y1="139" x2="298" y2="168" stroke="#c3d7ea" marker-end="url(#arr)"/>
  <rect x="40" y="170" width="190" height="46" fill="#21466a" stroke="#68839d"/>
  <text x="54" y="189" font-size="11" fill="#e8f1fa">agent C</text>
  <rect x="54" y="199" width="56" height="7" fill="#c3d7ea" stroke="none" fill-opacity="0.55"/>
  <text x="118" y="206" font-size="9" fill="#a7c0d9">runs alone (NT)</text>
  <line x1="230" y1="193" x2="298" y2="188" stroke="#c3d7ea" marker-end="url(#arr)"/>
  <rect x="40" y="224" width="190" height="46" fill="#21466a" stroke="#68839d"/>
  <text x="54" y="243" font-size="11" fill="#e8f1fa">agent D</text>
  <rect x="54" y="253" width="56" height="7" fill="#c3d7ea" stroke="none" fill-opacity="0.55"/>
  <text x="118" y="260" font-size="9" fill="#a7c0d9">runs alone (NT)</text>
  <line x1="230" y1="247" x2="298" y2="206" stroke="#c3d7ea" marker-end="url(#arr)"/>
  <text x="300" y="118" font-size="9" letter-spacing="1.5" fill="#6f8fb0">QUEUE</text>
  <rect x="300" y="126" width="150" height="104" fill="#21466a" stroke="#68839d"/>
  <text x="375" y="148" font-size="10" letter-spacing="1.5" fill="#e8f1fa" text-anchor="middle">NEEDS YOU</text>
  <rect x="322" y="162" width="28" height="24" fill="#12395f" stroke="#c3d7ea"/>
  <text x="336" y="178" font-size="10" fill="#c3d7ea" text-anchor="middle">D</text>
  <rect x="361" y="162" width="28" height="24" fill="#12395f" stroke="#c3d7ea"/>
  <text x="375" y="178" font-size="10" fill="#c3d7ea" text-anchor="middle">C</text>
  <rect x="400" y="162" width="28" height="24" fill="#12395f" stroke="#c3d7ea"/>
  <text x="414" y="178" font-size="10" fill="#c3d7ea" text-anchor="middle">B</text>
  <text x="375" y="208" font-size="9" fill="#6f8fb0" text-anchor="middle">waiting, idle</text>
  <line x1="450" y1="178" x2="518" y2="178" stroke="#c3d7ea" marker-end="url(#arr)"/>
  <text x="484" y="170" font-size="9" fill="#6f8fb0" text-anchor="middle">next</text>
  <text x="520" y="110" font-size="9" letter-spacing="1.5" fill="#6f8fb0">ONE SERVER</text>
  <rect x="520" y="118" width="200" height="120" fill="#21466a" stroke="#e8c56a" stroke-width="1.5"/>
  <text x="620" y="144" font-size="12" letter-spacing="2" fill="#e8c56a" text-anchor="middle">YOU</text>
  <text x="620" y="170" font-size="10.5" fill="#e8f1fa" text-anchor="middle">review + steer (IT)</text>
  <text x="620" y="188" font-size="10.5" fill="#c3d7ea" text-anchor="middle">+ re-orient (WT)</text>
  <text x="620" y="216" font-size="9" fill="#6f8fb0" text-anchor="middle">now serving: agent A</text>
  <path d="M 620 238 L 620 290 L 135 290 L 135 274" fill="none" stroke="#6f8fb0" marker-end="url(#arrdim)" style="stroke-dasharray:4 3"/>
  <text x="380" y="284" font-size="9" fill="#6f8fb0" text-anchor="middle">steered, back to work alone</text>
  <line x1="40" y1="302" x2="720" y2="302" stroke="#385a7b"/>
  <text x="380" y="326" font-size="12" fill="#e8f1fa" text-anchor="middle">cap = min( fan-out, open loops ~3-4, review rate, energy )</text>
</svg>
