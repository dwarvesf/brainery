<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 396" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-labelledby="t d">
  <title id="t">Fig. 2 timeline of three agents and one human over 40 minutes</title>
  <desc id="d">Gantt timeline, 0 to 40 minutes. Agents A, B, C work alone for 10 minutes, then wait for review. The human lane serves A, B, C in turn: a 1 minute re-orient sliver then a 3 minute review, highlighted. In the first round A waits 4, B waits 8, C waits 12 minutes. The human is busy 12 of every 14 minutes. FO = NT / (IT + WT) + 1 = 10 / 4 + 1 = 3.5.</desc>
