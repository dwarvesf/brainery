  <title id="t">Fig. 7 the lab after</title>
  <desc id="d">Three clusters: personal, household and company. Each has one owner agent that alone writes its board. Scripts and jobs below each owner propose with dashed arrows going up and are called by the owner with solid arrows going down.</desc>
