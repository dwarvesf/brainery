<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="Reviews and records flow into the bot, joined by ID; it proposes a change; the owner approves; the process updates">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#385a7b" stroke-width="0.5" opacity="0.6"/></pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c3d7ea"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e8c56a"/></marker>
  </defs>
  <rect width="760" height="330" fill="#12395f"/>
  <rect width="760" height="330" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="759" height="329" fill="none" stroke="#68839d"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="20" y="24" font-size="10" letter-spacing="1.5" fill="#a7c0d9">FIG. 5 · LET THE BOT HEAR THE WORLD</text>
    <text x="740" y="24" font-size="10" letter-spacing="1.5" fill="#6f8fb0" text-anchor="end">IMPROVEMENT FROM DATA</text>
    <line x1="20" y1="36" x2="740" y2="36" stroke="#68839d"/>
    <rect x="20" y="70" width="160" height="56" rx="4" fill="#21466a" stroke="#68839d" stroke-width="1"/>
    <text x="100.0" y="95.0" font-size="12" fill="#e8f1fa" text-anchor="middle">WORLD</text>
    <text x="100.0" y="111.0" font-size="10" fill="#a7c0d9" text-anchor="middle">reviews, email, replies</text>
    <rect x="20" y="170" width="160" height="56" rx="4" fill="#21466a" stroke="#68839d" stroke-width="1"/>
    <text x="100.0" y="195.0" font-size="12" fill="#e8f1fa" text-anchor="middle">RECORDS</text>
    <text x="100.0" y="211.0" font-size="10" fill="#a7c0d9" text-anchor="middle">arrival, keys, start, end</text>
    <rect x="280" y="118" width="170" height="60" rx="4" fill="#21466a" stroke="#e8c56a" stroke-width="2"/>
    <text x="365.0" y="145.0" font-size="12" fill="#e8c56a" text-anchor="middle" font-weight="bold">BOT</text>
    <text x="365.0" y="161.0" font-size="10" fill="#a7c0d9" text-anchor="middle">joins them by ID</text>
    <rect x="560" y="70" width="180" height="56" rx="4" fill="#21466a" stroke="#68839d" stroke-width="1"/>
    <text x="650.0" y="95.0" font-size="12" fill="#e8f1fa" text-anchor="middle">PROPOSAL</text>
    <text x="650.0" y="111.0" font-size="10" fill="#a7c0d9" text-anchor="middle">a change to the steps</text>
    <rect x="560" y="170" width="180" height="56" rx="4" fill="#21466a" stroke="#68839d" stroke-width="1"/>
    <text x="650.0" y="195.0" font-size="12" fill="#e8f1fa" text-anchor="middle">OWNER</text>
    <text x="650.0" y="211.0" font-size="10" fill="#a7c0d9" text-anchor="middle">approves or rejects</text>
    <line x1="180.0" y1="98.0" x2="276.0" y2="138.0" stroke="#c3d7ea" stroke-width="1" marker-end="url(#arr)"/>
    <line x1="180.0" y1="198.0" x2="276.0" y2="160.0" stroke="#c3d7ea" stroke-width="1" marker-end="url(#arr)"/>
    <line x1="450.0" y1="140.0" x2="556.0" y2="102.0" stroke="#c3d7ea" stroke-width="1" marker-end="url(#arr)"/>
    <line x1="650.0" y1="126.0" x2="650.0" y2="166.0" stroke="#c3d7ea" stroke-width="1" marker-end="url(#arr)"/>
    <path d="M560 210 H370 V182" fill="none" stroke="#c3d7ea" marker-end="url(#arr)" style="stroke-dasharray:4 3"/>
    <text x="470" y="228" font-size="10" fill="#6f8fb0" text-anchor="middle">process updates</text>
    <text x="20" y="270" font-size="11" fill="#e8f1fa" text-anchor="start">Example: a Yelp review says 'I waited too long'. The bot finds that visit by</text>
    <text x="20" y="288" font-size="11" fill="#e8f1fa" text-anchor="start">customer ID, reads the timestamps, and sees where the wait happened.</text>
    <text x="20" y="312" font-size="10" fill="#6f8fb0" text-anchor="start">Shared IDs (customer, order, email) are what let the sources join.</text>

  </g>
</svg>
