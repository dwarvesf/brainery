<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290">
  <rect width="760" height="290" fill="#12395f" stroke="#68839d" stroke-width="1"/>
  <text x="24" y="24" fill="#6f8fb0" font-family="ui-monospace, SFMono-Regular, Menlo" font-size="10" letter-spacing="2">FIG. 2 · THE ALPHABET KEYBOARD</text>
  <text x="736" y="24" text-anchor="end" fill="#6f8fb0" font-family="ui-monospace, SFMono-Regular, Menlo" font-size="10" letter-spacing="2">EACH REQUEST LOGS ONE LETTER</text>
  <line x1="24" y1="36" x2="736" y2="36" stroke="#68839d" stroke-width="1"/>

  <defs>
    <marker id="ah2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#c3d7ea" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- left: navigation sequence -->
  <text x="60" y="62" fill="#6f8fb0" font-family="ui-monospace, SFMono-Regular, Menlo" font-size="10" letter-spacing="1">CLAUDE VISITS</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo" font-size="12">
    <rect x="60" y="76" width="110" height="30" fill="#21466a" stroke="#68839d"/>
    <text x="115" y="95" text-anchor="middle" fill="#e8f1fa">/a</text>
    <rect x="60" y="116" width="110" height="30" fill="#21466a" stroke="#68839d"/>
    <text x="115" y="135" text-anchor="middle" fill="#e8f1fa">/ay</text>
    <rect x="60" y="156" width="110" height="30" fill="#21466a" stroke="#68839d"/>
    <text x="115" y="175" text-anchor="middle" fill="#e8f1fa">/ayu</text>
    <rect x="60" y="196" width="110" height="30" fill="#21466a" stroke="#68839d"/>
    <text x="115" y="215" text-anchor="middle" fill="#e8f1fa">/ayus</text>
    <rect x="60" y="236" width="110" height="30" fill="#21466a" stroke="#e8c56a" stroke-width="1.5"/>
    <text x="115" y="255" text-anchor="middle" fill="#e8c56a">/ayush</text>
  </g>
  <line x1="115" y1="106" x2="115" y2="112" stroke="#c3d7ea" stroke-width="1" marker-end="url(#ah2)"/>
  <line x1="115" y1="146" x2="115" y2="152" stroke="#c3d7ea" stroke-width="1" marker-end="url(#ah2)"/>
  <line x1="115" y1="186" x2="115" y2="192" stroke="#c3d7ea" stroke-width="1" marker-end="url(#ah2)"/>
  <line x1="115" y1="226" x2="115" y2="232" stroke="#c3d7ea" stroke-width="1" marker-end="url(#ah2)"/>

  <!-- right: attacker log panel -->
  <text x="360" y="62" fill="#6f8fb0" font-family="ui-monospace, SFMono-Regular, Menlo" font-size="10" letter-spacing="1">ATTACKER'S ACCESS LOG</text>
  <rect x="360" y="76" width="360" height="190" fill="#21466a" stroke="#68839d"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo" font-size="11" fill="#a7c0d9">
    <text x="378" y="99">203.0.113.7  GET /a     Claude-User</text>
    <text x="378" y="123">203.0.113.7  GET /ay    Claude-User</text>
    <text x="378" y="147">203.0.113.7  GET /ayu   Claude-User</text>
    <text x="378" y="171">203.0.113.7  GET /ayus  Claude-User</text>
    <text x="378" y="195" fill="#e8c56a">203.0.113.7  GET /ayush Claude-User</text>
    <text x="378" y="227" fill="#6f8fb0">read left to right, the path spells the name</text>
    <text x="378" y="247" fill="#6f8fb0">the agent thinks it is solving a captcha</text>
  </g>

  <line x1="170" y1="91" x2="354" y2="91" stroke="#c3d7ea" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="170" y1="131" x2="354" y2="115" stroke="#c3d7ea" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="170" y1="171" x2="354" y2="139" stroke="#c3d7ea" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="170" y1="211" x2="354" y2="163" stroke="#c3d7ea" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="170" y1="251" x2="354" y2="187" stroke="#c3d7ea" stroke-width="1" stroke-dasharray="3 3"/>
</svg>
