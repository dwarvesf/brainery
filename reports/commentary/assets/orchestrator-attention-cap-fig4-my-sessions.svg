<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-labelledby="t d">
  <title id="t">Fig. 4 share of active time by number of live sessions</title>
  <desc id="d">Bar chart of share of active time by number of live Claude Code sessions: 1 session 36%, 2 sessions 30%, 3 sessions 19%, 4 sessions 8.5%, 5 or more 6%. Bars 2, 3, 4 and 5+ are emphasised as running above the computed fan-out of about 1.8. Source: Mac Mini transcripts, 3 Oct to 2 Nov 2026, 348 sessions, 3,485 prompts.</desc>
  <defs>
    <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 .5H20M.5 0V20" fill="none" stroke="#edf0f4" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="760" height="452" fill="#eef1f4"/>
  <rect x="8" y="8" width="744" height="436" fill="#ffffff"/>
  <rect x="8" y="8" width="744" height="436" fill="url(#g)"/>
  <rect x="8.5" y="8.5" width="743" height="435" fill="none" stroke="#d3dae2"/>
  <text x="28" y="38" font-size="13.5" font-family="Archivo, 'Arial Narrow', 'Helvetica Neue', Arial, ui-monospace, monospace" font-weight="700" fill="#17212b">I run above my fan-out.</text>
  <text x="28" y="56" font-size="9.5" letter-spacing="1.2" font-weight="500" fill="#4e5b69">FIG. 4 · 30 DAYS OF MY SESSIONS</text>
  <line x1="8" y1="70" x2="752" y2="70" stroke="#d3dae2"/>

  <line x1="90" y1="354" x2="700" y2="354" stroke="#d3dae2" stroke-width="1"/>
  <text x="82" y="357.5" font-size="9.5" fill="#4e5b69" text-anchor="end">0%</text>
  <line x1="90" y1="291.5" x2="700" y2="291.5" stroke="#d3dae2" stroke-width="1"/>
  <text x="82" y="295" font-size="9.5" fill="#4e5b69" text-anchor="end">10%</text>
  <line x1="90" y1="229" x2="700" y2="229" stroke="#d3dae2" stroke-width="1"/>
  <text x="82" y="232.5" font-size="9.5" fill="#4e5b69" text-anchor="end">20%</text>
  <line x1="90" y1="166.5" x2="700" y2="166.5" stroke="#d3dae2" stroke-width="1"/>
  <text x="82" y="170" font-size="9.5" fill="#4e5b69" text-anchor="end">30%</text>
  <line x1="90" y1="104" x2="700" y2="104" stroke="#d3dae2" stroke-width="1"/>
  <text x="82" y="107.5" font-size="9.5" fill="#4e5b69" text-anchor="end">40%</text>
  <line x1="90" y1="354" x2="700" y2="354" stroke="#4e5b69" stroke-width="1.2"/>
  <line x1="90" y1="104" x2="90" y2="354" stroke="#4e5b69" stroke-width="1.2"/>
  <text x="90" y="92" font-size="9.5" letter-spacing="1.1" font-weight="500" fill="#4e5b69">SHARE OF ACTIVE TIME</text>
  <text x="395" y="392" font-size="9.5" letter-spacing="1.1" font-weight="500" fill="#4e5b69" text-anchor="middle">LIVE SESSIONS AT ONCE</text>
  <rect x="129" y="129" width="44" height="225" rx="2" fill="#ffffff" stroke="#4e5b69" stroke-width="1.2"/>
  <text x="151" y="121" font-size="11" font-weight="600" fill="#17212b" text-anchor="middle">36%</text>
  <text x="151" y="371" font-size="10.5" fill="#17212b" text-anchor="middle">1</text>
  <rect x="251" y="166.5" width="44" height="187.5" rx="2" fill="#e2f0f8" stroke="#0a6aa1" stroke-width="1.6"/>
  <text x="273" y="158.5" font-size="11" font-weight="600" fill="#0a6aa1" text-anchor="middle">30%</text>
  <text x="273" y="371" font-size="10.5" fill="#17212b" text-anchor="middle">2</text>
  <rect x="373" y="235.2" width="44" height="118.8" rx="2" fill="#e2f0f8" stroke="#0a6aa1" stroke-width="1.6"/>
  <text x="395" y="227.2" font-size="11" font-weight="600" fill="#0a6aa1" text-anchor="middle">19%</text>
  <text x="395" y="371" font-size="10.5" fill="#17212b" text-anchor="middle">3</text>
  <rect x="495" y="300.9" width="44" height="53.1" rx="2" fill="#e2f0f8" stroke="#0a6aa1" stroke-width="1.6"/>
  <text x="517" y="292.9" font-size="11" font-weight="600" fill="#0a6aa1" text-anchor="middle">8.5%</text>
  <text x="517" y="371" font-size="10.5" fill="#17212b" text-anchor="middle">4</text>
  <rect x="617" y="316.5" width="44" height="37.5" rx="2" fill="#e2f0f8" stroke="#0a6aa1" stroke-width="1.6"/>
  <text x="639" y="308.5" font-size="11" font-weight="600" fill="#0a6aa1" text-anchor="middle">6%</text>
  <text x="639" y="371" font-size="10.5" fill="#17212b" text-anchor="middle">5+</text>
  <line x1="248.6" y1="354" x2="248.6" y2="108" stroke="#17212b" stroke-width="1.3" style="stroke-dasharray:5 4"/>
  <text x="258.6" y="122" font-size="11" font-weight="600" fill="#17212b" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">fan-out ≈ 1.8</text>
  <text x="258.6" y="138" font-size="9.5" fill="#4e5b69" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">(median loop: 2.0 min alone, 2.5 min waiting)</text>
  <text x="517" y="199.2" font-size="11" font-weight="600" fill="#0a6aa1" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">64% of active time runs above fan-out</text>
  <text x="90" y="420" font-size="9.5" fill="#4e5b69">Mac Mini transcripts, 3 Oct to 2 Nov 2026, 348 sessions, 3,485 prompts.</text>
  <text x="90" y="435" font-size="9.5" fill="#4e5b69">Daily peak: median 5, max 14.</text>
</svg>
