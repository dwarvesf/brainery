<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-labelledby="t d">
  <title id="t">Fig. 4 share of active time by number of live sessions</title>
  <desc id="d">Bar chart of share of active time by number of live Claude Code sessions: 1 session 36%, 2 sessions 30%, 3 sessions 19%, 4 sessions 8.5%, 5 or more 6%. Bars 2, 3, 4 and 5+ are highlighted as running above the computed fan-out of about 1.8. Source: Mac Mini transcripts, 3 Oct to 2 Nov 2026, 348 sessions, 3,485 prompts.</desc>
  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#e8f1fa" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c3d7ea"/>
    </marker>
    <marker id="arrdim" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6f8fb0"/>
    </marker>
  </defs>
  <rect width="760" height="412" fill="#12395f"/>
  <rect width="760" height="412" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="759" height="411" fill="none" stroke="#68839d"/>
  <text x="14" y="24" font-size="10" letter-spacing="1.5" fill="#c3d7ea">FIG. 4 · 30 DAYS OF MY SESSIONS</text>
  <text x="746" y="24" font-size="10" letter-spacing="1.5" fill="#6f8fb0" text-anchor="end">I RUN ABOVE MY FAN-OUT</text>
  <line x1="0" y1="36" x2="760" y2="36" stroke="#385a7b"/>

  <line x1="90" y1="320" x2="700" y2="320" stroke="#385a7b" stroke-opacity="0.6"/>
  <text x="82" y="323" font-size="9" fill="#6f8fb0" text-anchor="end">0%</text>
  <line x1="90" y1="257.5" x2="700" y2="257.5" stroke="#385a7b" stroke-opacity="0.6"/>
  <text x="82" y="260.5" font-size="9" fill="#6f8fb0" text-anchor="end">10%</text>
  <line x1="90" y1="195" x2="700" y2="195" stroke="#385a7b" stroke-opacity="0.6"/>
  <text x="82" y="198" font-size="9" fill="#6f8fb0" text-anchor="end">20%</text>
  <line x1="90" y1="132.5" x2="700" y2="132.5" stroke="#385a7b" stroke-opacity="0.6"/>
  <text x="82" y="135.5" font-size="9" fill="#6f8fb0" text-anchor="end">30%</text>
  <line x1="90" y1="70" x2="700" y2="70" stroke="#385a7b" stroke-opacity="0.6"/>
  <text x="82" y="73" font-size="9" fill="#6f8fb0" text-anchor="end">40%</text>
  <text x="90" y="56" font-size="9" letter-spacing="1.5" fill="#6f8fb0">SHARE OF ACTIVE TIME</text>
  <rect x="129" y="95" width="44" height="225" fill="#21466a" stroke="#68839d"/>
  <text x="151" y="87" font-size="10.5" fill="#e8f1fa" text-anchor="middle">36%</text>
  <text x="151" y="336" font-size="10" fill="#c3d7ea" text-anchor="middle">1</text>
  <rect x="251" y="132.5" width="44" height="187.5" fill="#e8c56a" stroke="none"/>
  <text x="273" y="124.5" font-size="10.5" fill="#e8c56a" text-anchor="middle">30%</text>
  <text x="273" y="336" font-size="10" fill="#c3d7ea" text-anchor="middle">2</text>
  <rect x="373" y="201.25" width="44" height="118.75" fill="#e8c56a" stroke="none"/>
  <text x="395" y="193.25" font-size="10.5" fill="#e8c56a" text-anchor="middle">19%</text>
  <text x="395" y="336" font-size="10" fill="#c3d7ea" text-anchor="middle">3</text>
  <rect x="495" y="266.875" width="44" height="53.125" fill="#e8c56a" stroke="none"/>
  <text x="517" y="258.875" font-size="10.5" fill="#e8c56a" text-anchor="middle">8.5%</text>
  <text x="517" y="336" font-size="10" fill="#c3d7ea" text-anchor="middle">4</text>
  <rect x="617" y="282.5" width="44" height="37.5" fill="#e8c56a" stroke="none"/>
  <text x="639" y="274.5" font-size="10.5" fill="#e8c56a" text-anchor="middle">6%</text>
  <text x="639" y="336" font-size="10" fill="#c3d7ea" text-anchor="middle">5+</text>
  <line x1="90" y1="320" x2="700" y2="320" stroke="#68839d"/>
  <line x1="90" y1="70" x2="90" y2="320" stroke="#68839d"/>
  <text x="395" y="356" font-size="9" letter-spacing="1.5" fill="#6f8fb0" text-anchor="middle">LIVE SESSIONS AT ONCE</text>
  <line x1="248.6" y1="320" x2="248.6" y2="74" stroke="#e8f1fa" style="stroke-dasharray:5 4"/>
  <text x="258.6" y="88" font-size="10.5" fill="#e8f1fa">fan-out ≈ 1.8</text>
  <text x="258.6" y="103" font-size="9" fill="#a7c0d9">(median loop: 2.0 min alone, 2.5 min waiting)</text>
  <text x="517" y="165.25" font-size="10" fill="#e8c56a" text-anchor="middle">64% of active time runs above fan-out</text>
  <text x="90" y="384" font-size="9" fill="#6f8fb0">Mac Mini transcripts, 3 Oct to 2 Nov 2026, 348 sessions, 3,485 prompts.</text>
  <text x="90" y="398" font-size="9" fill="#6f8fb0">Daily peak: median 5, max 14.</text>
</svg>
