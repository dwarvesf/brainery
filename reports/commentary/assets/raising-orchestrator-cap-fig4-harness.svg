  <line x1="622" y1="196" x2="622" y2="259" stroke="#4e5b69" stroke-width="1.3"/>
  <polygon points="622,268 617.5,258 626.5,258" fill="#4e5b69"/>
  <line x1="512" y1="314" x2="499" y2="314" stroke="#4e5b69" stroke-width="1.3"/>
  <polygon points="490,314 500,309.5 500,318.5" fill="#4e5b69"/>
  <line x1="270" y1="314" x2="257" y2="314" stroke="#4e5b69" stroke-width="1.3"/>
  <polygon points="248,314 258,309.5 258,318.5" fill="#4e5b69"/>
  <path d="M 138.0 268 V 232.0 H 380.0 V 205" fill="none" stroke="#4e5b69" stroke-width="1.3" style="stroke-dasharray:5 4"/>
  <polygon points="380,196 384.5,206 375.5,206" fill="#4e5b69"/>
  <text x="265" y="225" font-size="10" fill="#17212b" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">park with a next-step line</text>
  <circle cx="167.0" cy="221.5" r="8.5" fill="#ffffff" stroke="#17212b" stroke-width="1.2"/>
  <text x="167" y="225" font-size="9.5" font-weight="700" fill="#17212b" text-anchor="middle">4</text>
  <line x1="138" y1="360" x2="138" y2="390" stroke="#4e5b69" stroke-width="1.2" style="stroke-dasharray:2 3"/>
  <rect x="28" y="390" width="220" height="40" rx="6" fill="#ffffff" stroke="#4e5b69" stroke-width="1.2"/>
  <circle cx="46" cy="410" r="8.5" fill="#ffffff" stroke="#17212b" stroke-width="1.2"/>
  <text x="46" y="413.5" font-size="9.5" font-weight="700" fill="#17212b" text-anchor="middle">8</text>
  <text x="62" y="407" font-size="10" font-weight="600" fill="#17212b">live-thread counter</text>
  <text x="62" y="421" font-size="10" fill="#4e5b69">warns above 3</text>
  <circle cx="279" cy="410" r="8.5" fill="#ffffff" stroke="#17212b" stroke-width="1.2"/>
  <text x="279" y="413.5" font-size="9.5" font-weight="700" fill="#17212b" text-anchor="middle">n</text>
  <text x="296" y="414" font-size="9.5" letter-spacing="1.1" font-weight="500" fill="#4e5b69">UPGRADE NUMBER, 1 TO 8</text>
