<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-labelledby="t d">
  <title id="t">Fig. 4 the harness loop with eight numbered upgrades</title>
  <desc id="d">A brief with a done-check goes to a worker that runs alone, then a verifier gate, a result card, the needs-me queue, and you, emphasised, who review and decide. Parked work returns to the worker with a next-step line. Upgrades: 1 verifier gate, 2 result card schema, 3 needs-me queue, 4 next-step line on park, 5 brief template with done-check, 6 safe auto-approve, 7 stall watchdog, 8 live-thread counter.</desc>
  <defs>
    <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 .5H20M.5 0V20" fill="none" stroke="#edf0f4" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="760" height="470" fill="#eef1f4"/>
  <rect x="8" y="8" width="744" height="454" fill="#ffffff"/>
  <rect x="8" y="8" width="744" height="454" fill="url(#g)"/>
  <rect x="8.5" y="8.5" width="743" height="453" fill="none" stroke="#d3dae2"/>
  <text x="28" y="38" font-size="13.5" font-family="Archivo, 'Arial Narrow', 'Helvetica Neue', Arial, ui-monospace, monospace" font-weight="700" fill="#17212b">The harness loop after the upgrades</text>
  <text x="28" y="56" font-size="9.5" letter-spacing="1.2" font-weight="500" fill="#4e5b69">FIG. 4 · WHAT WE ARE BUILDING</text>
  <line x1="8" y1="70" x2="752" y2="70" stroke="#d3dae2"/>

  <rect x="28" y="104" width="220" height="92" rx="6" fill="#ffffff" stroke="#4e5b69" stroke-width="1.2"/>
