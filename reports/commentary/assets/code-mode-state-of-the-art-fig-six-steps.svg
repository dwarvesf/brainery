<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 694" style="width:100%;height:auto;max-width:760px;display:block" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
<title>The six steps of one program: it is checked, run in a sandbox, its tool calls cross one bridge to the host, and one result string comes back</title><desc>An activity diagram, top to bottom. The model streams one program. Step 1, what the model saw. Step 2, repair, repeat guard and type-check, then a decision, compiles. If no, errors return as text, nothing ran, and the model gets the text back directly. If yes, step 3, a fresh sandbox, and step 4, the program runs, both inside a dashed sandbox boundary. Step 4 passes name and JSON args to step 5, the host pipeline outside the sandbox, and gets the result as JSON back, both in the accent color. Step 6, what comes back, ends with the model seeing one result string.</desc><defs><pattern id="f8g" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#e8f1fa" stroke-opacity="0.05"/></pattern><marker id="f8a" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L8 4L0 8z" fill="#c3d7ea"/></marker><marker id="f8am" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L8 4L0 8z" fill="#e8c56a"/></marker><marker id="f8ad" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L8 4L0 8z" fill="#6f8fb0"/></marker></defs>
<rect width="760" height="694" fill="#12395f"/>
<rect width="760" height="694" fill="url(#f8g)"/>
<rect x="0.5" y="0.5" width="759" height="693" fill="none" stroke="#68839d"/>
<text x="14" y="24" font-size="10" letter-spacing="1.5" fill="#c3d7ea">FIG. 6 · SIX STEPS</text>
<text x="746" y="24" font-size="10" letter-spacing="1.5" fill="#6f8fb0" text-anchor="end">ONE PROGRAM, MODEL TO MODEL</text>
<line x1="0" y1="36" x2="760" y2="36" stroke="#385a7b"/>
<rect x="10" y="342" width="330" height="196" fill="none" stroke="#6f8fb0" style="stroke-dasharray:5 4" rx="12"/><text x="190" y="359" font-size="10.5" fill="#6f8fb0">sandbox</text><text x="190" y="373" font-size="10.5" fill="#6f8fb0">QuickJS in WebAssembly</text><g><rect x="54" y="50" width="240" height="34" fill="#21466a" stroke="#c3d7ea" rx="17.0"/><text x="174.0" y="71.0" font-size="13.5" fill="#e8f1fa" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-weight="600">model streams one program</text></g><g><rect x="24" y="108" width="300" height="58" fill="#21466a" stroke="#68839d" rx="10"/><text x="174.0" y="132" font-size="13.5" fill="#e8f1fa" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-weight="600">1 · what the model saw</text><text x="174.0" y="151" font-size="11.5" fill="#c3d7ea" text-anchor="middle">one tool, a names-only index</text></g><g><rect x="24" y="190" width="300" height="58" fill="#21466a" stroke="#68839d" rx="10"/><text x="174.0" y="214" font-size="13.5" fill="#e8f1fa" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-weight="600">2 · repair, repeat guard, type-check</text><text x="174.0" y="233" font-size="11.5" fill="#c3d7ea" text-anchor="middle">checked before anything runs</text></g><g><polygon points="174.0,258 266.0,292 174.0,326 82.0,292" fill="#21466a" stroke="#68839d"/><text x="174.0" y="297" font-size="13.5" fill="#e8f1fa" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-weight="600">compiles?</text></g><g><rect x="470" y="263" width="254" height="58" fill="#21466a" stroke="#68839d" rx="10"/><text x="597.0" y="287" font-size="13.5" fill="#e8f1fa" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-weight="600">errors return as text</text><text x="597.0" y="306" font-size="11.5" fill="#c3d7ea" text-anchor="middle">nothing ran</text></g><g><rect x="24" y="384" width="300" height="58" fill="#21466a" stroke="#68839d" rx="10"/><text x="174.0" y="408" font-size="13.5" fill="#e8f1fa" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-weight="600">3 · fresh sandbox</text><text x="174.0" y="427" font-size="11.5" fill="#c3d7ea" text-anchor="middle">no files, no network, no process</text></g><g><rect x="24" y="466" width="300" height="58" fill="#21466a" stroke="#68839d" rx="10"/><text x="174.0" y="490" font-size="13.5" fill="#e8f1fa" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-weight="600">4 · the program runs</text><text x="174.0" y="509" font-size="11.5" fill="#c3d7ea" text-anchor="middle">each tool call crosses one bridge</text></g><g><rect x="470" y="466" width="254" height="58" fill="#21466a" stroke="#68839d" rx="10"/><text x="597.0" y="490" font-size="13.5" fill="#e8f1fa" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-weight="600">5 · host pipeline</text><text x="597.0" y="509" font-size="11.5" fill="#c3d7ea" text-anchor="middle">resolve · validate · approve</text></g><g><rect x="24" y="560" width="300" height="58" fill="#21466a" stroke="#68839d" rx="10"/><text x="174.0" y="584" font-size="13.5" fill="#e8f1fa" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-weight="600">6 · what comes back</text><text x="174.0" y="603" font-size="11.5" fill="#c3d7ea" text-anchor="middle">logs + return value, capped</text></g><g><rect x="54" y="642" width="240" height="34" fill="#21466a" stroke="#c3d7ea" rx="17.0"/><text x="174.0" y="663.0" font-size="13.5" fill="#e8f1fa" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-weight="600">model sees one result string</text></g><g><path d="M174.0 84V106" fill="none" stroke="#c3d7ea" stroke-width="1.4" marker-end="url(#f8a)"/></g><g><path d="M174.0 166V188" fill="none" stroke="#c3d7ea" stroke-width="1.4" marker-end="url(#f8a)"/></g><g><path d="M174.0 326V382" fill="none" stroke="#c3d7ea" stroke-width="1.4" marker-end="url(#f8a)"/><text x="166.0" y="338" font-size="11.5" fill="#c3d7ea" text-anchor="end">yes</text></g><g><path d="M268.0 292H468" fill="none" stroke="#c3d7ea" stroke-width="1.4" style="stroke-dasharray:4 3" marker-end="url(#f8a)"/><text x="369.0" y="284" font-size="11.5" fill="#c3d7ea" text-anchor="middle">no</text></g><g><path d="M726 292H746V659H296" fill="none" stroke="#c3d7ea" stroke-width="1.4" style="stroke-dasharray:4 3" marker-end="url(#f8a)"/></g><g><path d="M174.0 442V464" fill="none" stroke="#c3d7ea" stroke-width="1.4" marker-end="url(#f8a)"/></g><g><path d="M326 485H468" fill="none" stroke="#e8c56a" stroke-width="1.8" marker-end="url(#f8am)"/><text x="397.0" y="477" font-size="11.5" fill="#e8c56a" text-anchor="middle">name + JSON args</text></g><g><path d="M468 510H326" fill="none" stroke="#e8c56a" stroke-width="1.8" marker-end="url(#f8am)"/><text x="397.0" y="528" font-size="11.5" fill="#e8c56a" text-anchor="middle">result as JSON</text></g><g><path d="M174.0 524V558" fill="none" stroke="#c3d7ea" stroke-width="1.4" marker-end="url(#f8a)"/></g><g><path d="M174.0 618V640" fill="none" stroke="#c3d7ea" stroke-width="1.4" marker-end="url(#f8a)"/></g>
</svg>
