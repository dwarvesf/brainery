<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" style="width:100%;height:auto;max-width:760px;display:block" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#e8f1fa" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c3d7ea"/>
    </marker>
  </defs>
  <rect width="760" height="330" fill="#12395f"/>
  <rect width="760" height="330" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="759" height="329" fill="none" stroke="#68839d"/>
  <text x="14" y="24" font-size="10" letter-spacing="1.5" fill="#c3d7ea">FIG. 7 · WHY A CHIP COMPANY SELLS A $59 KIT</text>
  <text x="746" y="24" font-size="10" letter-spacing="1.5" fill="#6f8fb0" text-anchor="end">OUR READ, NOT ESPRESSIF'S WORDS</text>
  <line x1="0" y1="36" x2="760" y2="36" stroke="#385a7b"/>

  <!-- stage 1 -->
  <rect x="20" y="70" width="150" height="110" fill="#21466a" stroke="#68839d"/>
  <text x="95" y="102" font-size="11" letter-spacing="1" fill="#e8f1fa" text-anchor="middle">$59 KIT</text>
  <text x="95" y="124" font-size="9" fill="#a7c0d9" text-anchor="middle">ESP-Mosaico</text>
  <text x="95" y="138" font-size="9" fill="#a7c0d9" text-anchor="middle">new S31 chip inside</text>
  <text x="95" y="152" font-size="9" fill="#a7c0d9" text-anchor="middle">priced like a sample</text>
  <line x1="170" y1="125" x2="200" y2="125" stroke="#c3d7ea" marker-end="url(#arr)"/>

  <!-- stage 2 -->
  <rect x="202" y="78" width="150" height="94" fill="#21466a" stroke="#68839d"/>
  <text x="277" y="106" font-size="11" letter-spacing="1" fill="#e8f1fa" text-anchor="middle">DEVELOPERS</text>
  <text x="277" y="126" font-size="9" fill="#a7c0d9" text-anchor="middle">plus their coding</text>
  <text x="277" y="140" font-size="9" fill="#a7c0d9" text-anchor="middle">agents, learn S31</text>
  <line x1="352" y1="125" x2="382" y2="125" stroke="#c3d7ea" marker-end="url(#arr)"/>

  <!-- stage 3 -->
  <rect x="384" y="86" width="150" height="78" fill="#21466a" stroke="#68839d"/>
  <text x="459" y="112" font-size="11" letter-spacing="1" fill="#e8f1fa" text-anchor="middle">PRODUCTS</text>
  <text x="459" y="132" font-size="9" fill="#a7c0d9" text-anchor="middle">designed on S31</text>
  <text x="459" y="146" font-size="9" fill="#a7c0d9" text-anchor="middle">"ready for products"</text>
  <line x1="534" y1="125" x2="564" y2="125" stroke="#c3d7ea" marker-end="url(#arr)"/>

  <!-- stage 4 -->
  <rect x="566" y="56" width="174" height="138" fill="#21466a" stroke="#e8c56a" stroke-width="2"/>
  <text x="653" y="100" font-size="12" letter-spacing="2" fill="#e8c56a" text-anchor="middle">CHIP VOLUME</text>
  <text x="653" y="124" font-size="9" fill="#c3d7ea" text-anchor="middle">S31 modules ordered</text>
  <text x="653" y="138" font-size="9" fill="#c3d7ea" text-anchor="middle">by the thousand</text>
  <text x="653" y="160" font-size="9" fill="#c3d7ea" text-anchor="middle">Espressif's real revenue</text>

  <!-- lock-in layer -->
  <rect x="202" y="208" width="332" height="40" fill="none" stroke="#68839d" style="stroke-dasharray:4 3"/>
  <text x="368" y="226" font-size="10" letter-spacing="1" fill="#e8f1fa" text-anchor="middle">STICKINESS LAYER</text>
  <text x="368" y="240" font-size="9" fill="#a7c0d9" text-anchor="middle">ESP-Claw · vibe workspace · Ideas store</text>
  <line x1="277" y1="208" x2="277" y2="174" stroke="#c3d7ea" style="stroke-dasharray:3 3" marker-end="url(#arr)"/>
  <line x1="459" y1="208" x2="459" y2="166" stroke="#c3d7ea" style="stroke-dasharray:3 3" marker-end="url(#arr)"/>

  <line x1="20" y1="272" x2="740" y2="272" stroke="#385a7b"/>
  <text x="20" y="292" font-size="9" letter-spacing="1.5" fill="#6f8fb0">PRECEDENT</text>
  <text x="20" y="310" font-size="9" fill="#a7c0d9">ESP32-S3-BOX  →  community Xiaozhi voice firmware  →  Espressif ships Xiaozhi on its own ESP-Hi</text>
</svg>
