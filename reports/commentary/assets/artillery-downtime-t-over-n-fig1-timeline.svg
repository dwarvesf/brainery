<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" style="width:100%;height:auto;max-width:760px;display:block" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0 H0 V20" fill="none" stroke="#385a7b" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="760" height="300" fill="#12395f"/>
  <rect width="760" height="300" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="759" height="299" fill="none" stroke="#68839d"/>
  <text x="16" y="24" fill="#a7c0d9" font-size="10" letter-spacing="2">FIG. 1 · T OVER N</text>
  <text x="744" y="24" fill="#6f8fb0" font-size="10" letter-spacing="2" text-anchor="end">10 MIN · 4 PLAYERS</text>
  <line x1="16" y1="36" x2="744" y2="36" stroke="#68839d"/>

  <!-- axis -->
  <line x1="120" y1="250" x2="720" y2="250" stroke="#68839d"/>
  <text x="120" y="268" fill="#6f8fb0" font-size="10" text-anchor="middle">0:00</text>
  <text x="420" y="268" fill="#6f8fb0" font-size="10" text-anchor="middle">5:00</text>
  <text x="720" y="268" fill="#6f8fb0" font-size="10" text-anchor="middle">10:00</text>

  <!-- rows: 4 players, each row 36px high. 600px = 10 min. turn = 30s = 30px; cycle 4 turns = 120px -->
  <!-- Player 1 -->
  <text x="40" y="78" fill="#e8f1fa" font-size="11">P1</text>
  <rect x="120" y="66" width="600" height="16" fill="#21466a" stroke="#68839d"/>
  <rect x="120" y="66" width="30" height="16" fill="#c3d7ea"/>
  <rect x="240" y="66" width="30" height="16" fill="#c3d7ea"/>
  <rect x="360" y="66" width="30" height="16" fill="#c3d7ea"/>
  <rect x="480" y="66" width="30" height="16" fill="#c3d7ea"/>
  <rect x="600" y="66" width="30" height="16" fill="#c3d7ea"/>
  <!-- Player 2 -->
  <text x="40" y="118" fill="#e8f1fa" font-size="11">P2</text>
  <rect x="120" y="106" width="600" height="16" fill="#21466a" stroke="#68839d"/>
  <rect x="150" y="106" width="30" height="16" fill="#c3d7ea"/>
  <rect x="270" y="106" width="30" height="16" fill="#c3d7ea"/>
  <rect x="390" y="106" width="30" height="16" fill="#c3d7ea"/>
  <rect x="510" y="106" width="30" height="16" fill="#c3d7ea"/>
  <rect x="630" y="106" width="30" height="16" fill="#c3d7ea"/>
  <!-- Player 3: dies at 5:30 -->
  <text x="40" y="158" fill="#e8f1fa" font-size="11">P3</text>
  <rect x="120" y="146" width="600" height="16" fill="#21466a" stroke="#68839d"/>
  <rect x="180" y="146" width="30" height="16" fill="#c3d7ea"/>
  <rect x="300" y="146" width="30" height="16" fill="#c3d7ea"/>
  <rect x="420" y="146" width="30" height="16" fill="#c3d7ea"/>
  <rect x="480" y="146" width="240" height="16" fill="#12395f" stroke="#68839d" stroke-dasharray="3 3"/>
  <text x="600" y="158" fill="#6f8fb0" font-size="10" text-anchor="middle">dead: nothing to do</text>
  <!-- Player 4 -->
  <text x="40" y="198" fill="#e8f1fa" font-size="11">P4</text>
  <rect x="120" y="186" width="600" height="16" fill="#21466a" stroke="#68839d"/>
  <rect x="210" y="186" width="30" height="16" fill="#c3d7ea"/>
  <rect x="330" y="186" width="30" height="16" fill="#c3d7ea"/>
  <rect x="450" y="186" width="30" height="16" fill="#c3d7ea"/>
  <rect x="570" y="186" width="30" height="16" fill="#c3d7ea"/>
  <rect x="690" y="186" width="30" height="16" fill="#c3d7ea"/>

  <!-- amber: off-turn actions for P4 while P1 shoots -->
  <rect x="124" y="208" width="22" height="5" fill="#e8c56a"/>
  <rect x="244" y="208" width="22" height="5" fill="#e8c56a"/>
  <rect x="364" y="208" width="22" height="5" fill="#e8c56a"/>
  <rect x="484" y="208" width="22" height="5" fill="#e8c56a"/>
  <rect x="604" y="208" width="22" height="5" fill="#e8c56a"/>
  <text x="300" y="228" fill="#e8c56a" font-size="10">off-turn action proposed in the thread: raise a shield, help defend</text>

  <!-- legend -->
  <rect x="120" y="48" width="12" height="8" fill="#c3d7ea"/>
  <text x="138" y="56" fill="#a7c0d9" font-size="10">my turn (~T/N = 2.5 min of 10)</text>
  <rect x="380" y="48" width="12" height="8" fill="#21466a" stroke="#68839d"/>
  <text x="398" y="56" fill="#a7c0d9" font-size="10">waiting (7.5 min)</text>
</svg>
