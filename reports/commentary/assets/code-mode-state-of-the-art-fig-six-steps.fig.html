<rect x="10" y="342" width="330" height="196" fill="none" stroke="#6f8fb0" style="stroke-dasharray:5 4" rx="12"/><text x="190" y="359" font-size="10.5" fill="#6f8fb0">sandbox</text><text x="190" y="373" font-size="10.5" fill="#6f8fb0">QuickJS in WebAssembly</text><g data-fk-node="start" data-tip="The model writes one program and streams it." data-animate="sequence" data-step="0"><rect x="54" y="50" width="240" height="34" fill="#21466a" stroke="#c3d7ea" rx="17.0"/><text x="174.0" y="71.0" font-size="13.5" fill="#e8f1fa" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-weight="600">model streams one program</text></g><g data-fk-node="s1" data-tip="One tool in the menu. Everything else is a function inside the program." data-animate="sequence" data-step="1"><rect x="24" y="108" width="300" height="58" fill="#21466a" stroke="#68839d" rx="10"/><text x="174.0" y="132" font-size="13.5" fill="#e8f1fa" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-weight="600">1 · what the model saw</text><text x="174.0" y="151" font-size="11.5" fill="#c3d7ea" text-anchor="middle">one tool, a names-only index</text></g><g data-fk-node="s2" data-tip="TypeScript compiles it against every tool surface." data-animate="sequence" data-step="2"><rect x="24" y="190" width="300" height="58" fill="#21466a" stroke="#68839d" rx="10"/><text x="174.0" y="214" font-size="13.5" fill="#e8f1fa" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-weight="600">2 · repair, repeat guard, type-check</text><text x="174.0" y="233" font-size="11.5" fill="#c3d7ea" text-anchor="middle">checked before anything runs</text></g><g data-fk-node="s2" data-tip="TypeScript compiles it against every tool surface." data-animate="sequence" data-step="2.5"><polygon points="174.0,258 266.0,292 174.0,326 82.0,292" fill="#21466a" stroke="#68839d"/><text x="174.0" y="297" font-size="13.5" fill="#e8f1fa" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-weight="600">compiles?</text></g><g data-fk-node="err" data-tip="Errors return as text. Zero side effects: nothing ran." data-animate="sequence" data-step="3"><rect x="470" y="263" width="254" height="58" fill="#21466a" stroke="#68839d" rx="10"/><text x="597.0" y="287" font-size="13.5" fill="#e8f1fa" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-weight="600">errors return as text</text><text x="597.0" y="306" font-size="11.5" fill="#c3d7ea" text-anchor="middle">nothing ran</text></g><g data-fk-node="s3" data-tip="A new context for every program, thrown away at the end." data-animate="sequence" data-step="4"><rect x="24" y="384" width="300" height="58" fill="#21466a" stroke="#68839d" rx="10"/><text x="174.0" y="408" font-size="13.5" fill="#e8f1fa" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-weight="600">3 · fresh sandbox</text><text x="174.0" y="427" font-size="11.5" fill="#c3d7ea" text-anchor="middle">no files, no network, no process</text></g><g data-fk-node="s4" data-tip="A read call becomes one host call with JSON arguments. A promise comes back at once." data-animate="sequence" data-step="5"><rect x="24" y="466" width="300" height="58" fill="#21466a" stroke="#68839d" rx="10"/><text x="174.0" y="490" font-size="13.5" fill="#e8f1fa" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-weight="600">4 · the program runs</text><text x="174.0" y="509" font-size="11.5" fill="#c3d7ea" text-anchor="middle">each tool call crosses one bridge</text></g><g data-fk-node="s5" data-tip="Resolve, validate, approve, run, bound. Only after approve does anything real happen. The host runs the real tool, not the sandbox." data-animate="sequence" data-step="6"><rect x="470" y="466" width="254" height="58" fill="#21466a" stroke="#68839d" rx="10"/><text x="597.0" y="490" font-size="13.5" fill="#e8f1fa" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-weight="600">5 · host pipeline</text><text x="597.0" y="509" font-size="11.5" fill="#c3d7ea" text-anchor="middle">resolve · validate · approve</text></g><g data-fk-node="s6" data-tip="Logs and the value as YAML, capped at 50,000 characters. The model reads one string." data-animate="sequence" data-step="7"><rect x="24" y="560" width="300" height="58" fill="#21466a" stroke="#68839d" rx="10"/><text x="174.0" y="584" font-size="13.5" fill="#e8f1fa" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-weight="600">6 · what comes back</text><text x="174.0" y="603" font-size="11.5" fill="#c3d7ea" text-anchor="middle">logs + return value, capped</text></g><g data-fk-node="s6" data-tip="The model reads one string." data-animate="sequence" data-step="7"><rect x="54" y="642" width="240" height="34" fill="#21466a" stroke="#c3d7ea" rx="17.0"/><text x="174.0" y="663.0" font-size="13.5" fill="#e8f1fa" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-weight="600">model sees one result string</text></g><g data-fk-edge="start s1" data-tip="The program is handed over."><path d="M174.0 84V106" fill="none" stroke="#c3d7ea" stroke-width="1.4" marker-end="url(#f8a)" data-animate="draw" data-step="0.5"/></g><g data-fk-edge="s1 s2" data-tip="Next, the checks."><path d="M174.0 166V188" fill="none" stroke="#c3d7ea" stroke-width="1.4" marker-end="url(#f8a)" data-animate="draw" data-step="1.5"/></g><g data-fk-edge="s2 s3" data-tip="It compiles, so it runs."><path d="M174.0 326V382" fill="none" stroke="#c3d7ea" stroke-width="1.4" marker-end="url(#f8a)" data-animate="draw" data-step="4"/><text x="166.0" y="338" font-size="11.5" fill="#c3d7ea" text-anchor="end">yes</text></g><g data-fk-edge="s2 err" data-tip="It does not compile."><path d="M268.0 292H468" fill="none" stroke="#c3d7ea" stroke-width="1.4" style="stroke-dasharray:4 3" marker-end="url(#f8a)" data-animate="draw" data-step="3"/><text x="369.0" y="284" font-size="11.5" fill="#c3d7ea" text-anchor="middle">no</text></g><g data-fk-edge="err s6" data-tip="The error text goes straight back to the model. Steps 3 to 6 are skipped."><path d="M726 292H746V659H296" fill="none" stroke="#c3d7ea" stroke-width="1.4" style="stroke-dasharray:4 3" marker-end="url(#f8a)" data-animate="draw" data-step="3.5"/></g><g data-fk-edge="s3 s4" data-tip="The program starts."><path d="M174.0 442V464" fill="none" stroke="#c3d7ea" stroke-width="1.4" marker-end="url(#f8a)" data-animate="draw" data-step="4.5"/></g><g data-fk-edge="s4 s5" data-fk-node="s4" data-tip="Name plus JSON args cross to the host."><path d="M326 485H468" fill="none" stroke="#e8c56a" stroke-width="1.8" marker-end="url(#f8am)" data-animate="draw" data-step="6"/><text x="397.0" y="477" font-size="11.5" fill="#e8c56a" text-anchor="middle">name + JSON args</text></g><g data-fk-edge="s5 s4" data-fk-node="s4" data-tip="The result comes back as JSON."><path d="M468 510H326" fill="none" stroke="#e8c56a" stroke-width="1.8" marker-end="url(#f8am)" data-animate="draw" data-step="6.5"/><text x="397.0" y="528" font-size="11.5" fill="#e8c56a" text-anchor="middle">result as JSON</text></g><g data-fk-edge="s5 s6" data-tip="The program returns."><path d="M174.0 524V558" fill="none" stroke="#c3d7ea" stroke-width="1.4" marker-end="url(#f8a)" data-animate="draw" data-step="7"/></g><g data-fk-edge="s6 s6" data-tip="One string goes back."><path d="M174.0 618V640" fill="none" stroke="#c3d7ea" stroke-width="1.4" marker-end="url(#f8a)" data-animate="draw" data-step="7.5"/></g>
</svg>
