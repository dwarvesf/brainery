<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="width:100%;height:auto;max-width:760px;display:block" role="img">
<title>Native tool calling re-sends the tool menu on every request</title>
<desc>Three requests, each carrying the same 102 tool definitions of about 29k tokens in an amber band, plus the question, then 30 zone objects, then 30 DNSSEC results. Input tokens grow 29,048, 45,274, 56,753.</desc>
<defs>
<pattern id="g2" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#e8f1fa" stroke-opacity="0.05"/></pattern>
<marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#c3d7ea"/></marker>
<marker id="am" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#e8c56a"/></marker>
<marker id="ad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#6f8fb0"/></marker>
</defs>
<rect width="760" height="410" fill="#12395f"/>
<rect width="760" height="410" fill="url(#g2)"/>
<rect x="0.5" y="0.5" width="759" height="409" fill="none" stroke="#68839d"/>
<text x="14" y="24" font-size="10" letter-spacing="1.5" fill="#c3d7ea">FIG. 1 · THE MENU AND THE LOOP</text>
<text x="746" y="24" font-size="10" letter-spacing="1.5" fill="#6f8fb0" text-anchor="end">NATIVE · N=30</text>
<line x1="0" y1="36" x2="760" y2="36" stroke="#385a7b"/>
<rect x="480" y="62" width="100" height="272" fill="#21466a" stroke="#68839d"/>
<text x="530" y="202" font-size="10.5" fill="#e8f1fa" text-anchor="middle">model</text>
<text x="24" y="104" font-size="9.5" fill="#a7c0d9" text-anchor="start">request 1</text>
<rect x="120" y="62" width="280" height="76" fill="#21466a" stroke="#68839d"/>
<rect x="130" y="72" width="260" height="30" fill="#e8c56a"/>
<text x="260" y="92" font-size="9.5" fill="#12395f" text-anchor="middle">102 tool defs · ~29k tokens</text>
<text x="260" y="124" font-size="9.5" fill="#c3d7ea" text-anchor="middle">question</text>
<line x1="400" y1="100" x2="478" y2="100" stroke="#c3d7ea" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="582" y1="100" x2="600" y2="100" stroke="#c3d7ea" stroke-width="1.2" marker-end="url(#a)"/>
<text x="608" y="104" font-size="9.5" fill="#e8f1fa" text-anchor="start">list_zones()</text>
<text x="24" y="202" font-size="9.5" fill="#a7c0d9" text-anchor="start">request 2</text>
<rect x="120" y="160" width="280" height="76" fill="#21466a" stroke="#68839d"/>
<rect x="130" y="170" width="260" height="30" fill="#e8c56a"/>
<text x="260" y="190" font-size="9.5" fill="#12395f" text-anchor="middle">102 tool defs · ~29k tokens</text>
<text x="260" y="222" font-size="9.5" fill="#c3d7ea" text-anchor="middle">30 zone objects · 20 KB</text>
<line x1="400" y1="198" x2="478" y2="198" stroke="#c3d7ea" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="582" y1="198" x2="600" y2="198" stroke="#c3d7ea" stroke-width="1.2" marker-end="url(#a)"/>
<text x="608" y="202" font-size="9.5" fill="#e8f1fa" text-anchor="start">30 × get_dnssec</text>
<text x="24" y="300" font-size="9.5" fill="#a7c0d9" text-anchor="start">request 3</text>
<rect x="120" y="258" width="280" height="76" fill="#21466a" stroke="#68839d"/>
<rect x="130" y="268" width="260" height="30" fill="#e8c56a"/>
<text x="260" y="288" font-size="9.5" fill="#12395f" text-anchor="middle">102 tool defs · ~29k tokens</text>
<text x="260" y="320" font-size="9.5" fill="#c3d7ea" text-anchor="middle">30 DNSSEC results · 14 KB</text>
<line x1="400" y1="296" x2="478" y2="296" stroke="#c3d7ea" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="582" y1="296" x2="600" y2="296" stroke="#c3d7ea" stroke-width="1.2" marker-end="url(#a)"/>
<text x="608" y="300" font-size="9.5" fill="#e8f1fa" text-anchor="start">3 zone names</text>
<text x="260" y="372" font-size="10" fill="#c3d7ea" text-anchor="middle">29,048 → 45,274 → 56,753 input tokens</text>
