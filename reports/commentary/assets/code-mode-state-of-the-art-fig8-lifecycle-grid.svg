<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="width:100%;height:auto;max-width:760px;display:block" role="img">
<title>Where the code runs and how a call crosses back, for eight implementations in three families</title>
<desc>A grid of eight columns with two rows. Row 3 shows where the code runs: QuickJS local for pi-fabric, V8 isolates on Cloudflare for the SDK and MCP server, no code for Anthropic tool search, a container at Anthropic, V8 at OpenAI, an AST interpreter or remote sandbox for smolagents, Jupyter in Docker for CodeAct. Row 4 shows how a call crosses back: pi-fabric uses a JSON bridge, drawn in amber; Cloudflare uses Workers RPC or fetch with injected auth; the two hosted runtimes pause and resume the API request; the last three have no crossing. Three families are bracketed.</desc>
