  <title id="t">Fig. 1 the series map</title>
  <desc id="d">The hub P0 is the entry point. Twelve pillars follow in reading order in four stages. Foundations: P1 modeling with 1 deep dive, P2 tool design 1, P3 quality 5, P4 failure modes 2. Runtime: P5 execution 4, P6 context and memory 6, P7 cost and performance 3, P8 durable runs 2. Production: P9 security 1, P10 operations 1, P11 people in the loop 1. Factory: P12 software factory 2. B1 product strategy is optional with no deep dive yet. 29 deep dives in all.</desc>
