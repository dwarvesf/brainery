  <title id="t">Fig. 2 median minutes an agent worked alone, by brief length and by whether the turn ran a skill</title>
  <desc id="d">Horizontal bars of median minutes alone with a p75 tick. Under 50 chars 1.4 (p75 7.4), 50 to 200 chars 2.0 (7.9), 200 to 1,000 chars 3.9 (12.2), over 1,000 chars 9.4 (28.5). Turn ran a skill 7.9 (23.1), turn ran neither 1.6 (7.2). Over 1,000 chars and ran a skill are emphasised.</desc>
