<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="Two processes reach the same goal: today's five steps and a shorter path the bot finds">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#385a7b" stroke-width="0.5" opacity="0.6"/></pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c3d7ea"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e8c56a"/></marker>
  </defs>
  <rect width="760" height="330" fill="#12395f"/>
  <rect width="760" height="330" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="759" height="329" fill="none" stroke="#68839d"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="20" y="24" font-size="10" letter-spacing="1.5" fill="#a7c0d9">FIG. 2 · HOLD THE GOAL, LET THE PROCESS MOVE</text>
    <text x="740" y="24" font-size="10" letter-spacing="1.5" fill="#6f8fb0" text-anchor="end">PROCESS IS DISPOSABLE</text>
    <line x1="20" y1="36" x2="740" y2="36" stroke="#68839d"/>
    <rect x="560" y="120" width="170" height="90" rx="4" fill="#21466a" stroke="#e8c56a" stroke-width="2"/>
    <text x="645.0" y="162.0" font-size="13" fill="#e8c56a" text-anchor="middle" font-weight="bold">GOAL</text>
    <text x="645.0" y="178.0" font-size="10" fill="#a7c0d9" text-anchor="middle">good reviews</text>
    <text x="20" y="72" font-size="11" fill="#c3d7ea" text-anchor="start">YOUR PROCESS TODAY</text>
    <rect x="20" y="82" width="84" height="34" rx="4" fill="#21466a" stroke="#68839d" stroke-width="1"/>
    <text x="62.0" y="103.0" font-size="12" fill="#e8f1fa" text-anchor="middle">form</text>
    <rect x="120" y="82" width="84" height="34" rx="4" fill="#21466a" stroke="#68839d" stroke-width="1"/>
    <text x="162.0" y="103.0" font-size="12" fill="#e8f1fa" text-anchor="middle">email</text>
    <rect x="220" y="82" width="84" height="34" rx="4" fill="#21466a" stroke="#68839d" stroke-width="1"/>
    <text x="262.0" y="103.0" font-size="12" fill="#e8f1fa" text-anchor="middle">call</text>
    <rect x="320" y="82" width="84" height="34" rx="4" fill="#21466a" stroke="#68839d" stroke-width="1"/>
    <text x="362.0" y="103.0" font-size="12" fill="#e8f1fa" text-anchor="middle">re-check</text>
    <rect x="420" y="82" width="84" height="34" rx="4" fill="#21466a" stroke="#68839d" stroke-width="1"/>
    <text x="462.0" y="103.0" font-size="12" fill="#e8f1fa" text-anchor="middle">remind</text>
    <line x1="104.0" y1="99.0" x2="118.0" y2="99.0" stroke="#c3d7ea" stroke-width="1" marker-end="url(#arr)"/>
    <line x1="204.0" y1="99.0" x2="218.0" y2="99.0" stroke="#c3d7ea" stroke-width="1" marker-end="url(#arr)"/>
    <line x1="304.0" y1="99.0" x2="318.0" y2="99.0" stroke="#c3d7ea" stroke-width="1" marker-end="url(#arr)"/>
    <line x1="404.0" y1="99.0" x2="418.0" y2="99.0" stroke="#c3d7ea" stroke-width="1" marker-end="url(#arr)"/>
    <line x1="504.0" y1="99.0" x2="556.0" y2="140.0" stroke="#c3d7ea" stroke-width="1" marker-end="url(#arr)"/>
    <text x="20" y="196" font-size="11" fill="#c3d7ea" text-anchor="start">A SHORTER PATH THE BOT FINDS</text>
    <rect x="20" y="206" width="130" height="34" rx="4" fill="#21466a" stroke="#68839d" stroke-width="1"/>
    <text x="85.0" y="227.0" font-size="12" fill="#e8f1fa" text-anchor="middle">booking link</text>
    <rect x="190" y="206" width="130" height="34" rx="4" fill="#21466a" stroke="#68839d" stroke-width="1"/>
    <text x="255.0" y="227.0" font-size="12" fill="#e8f1fa" text-anchor="middle">auto confirm</text>
    <rect x="360" y="206" width="130" height="34" rx="4" fill="#21466a" stroke="#68839d" stroke-width="1"/>
    <text x="425.0" y="227.0" font-size="12" fill="#e8f1fa" text-anchor="middle">follow-up</text>
    <line x1="150.0" y1="223.0" x2="188.0" y2="223.0" stroke="#c3d7ea" stroke-width="1" marker-end="url(#arr)"/>
    <line x1="320.0" y1="223.0" x2="358.0" y2="223.0" stroke="#c3d7ea" stroke-width="1" marker-end="url(#arr)"/>
    <line x1="490.0" y1="223.0" x2="556.0" y2="190.0" stroke="#c3d7ea" stroke-width="1" marker-end="url(#arr)"/>
    <text x="20" y="286" font-size="11" fill="#e8f1fa" text-anchor="start">The goal is the contract. The process is a means, so the bot may change it.</text>
    <text x="20" y="306" font-size="10" fill="#6f8fb0" text-anchor="start">Check every new path against the goal, never against the old steps.</text>

  </g>
</svg>
