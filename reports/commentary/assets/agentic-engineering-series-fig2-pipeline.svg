<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" style="width:100%;height:auto;max-width:760px;display:block" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-labelledby="t d">
  <title id="t">Fig. 2 how each part is built</title>
  <desc id="d">Each part passes eight stages left to right: brief, white-paper sweep, firsthand experiment, draft, claim check, voice and rubric, owner review with a hands-on exercise, publish. The firsthand experiment is one dated measurement from our own estate. Each part ends in two outputs: the memo article and the learning Day with an on-ramp.</desc>
