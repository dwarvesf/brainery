<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#e8f1fa" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c3d7ea"/>
    </marker>
  </defs>
  <rect width="760" height="300" fill="#12395f"/>
  <rect width="760" height="300" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="759" height="299" fill="none" stroke="#68839d"/>
  <text x="14" y="24" font-size="10" letter-spacing="1.5" fill="#c3d7ea">FIG. 2 · ROUTE BY WHAT THE WORK NEEDS</text>
  <text x="746" y="24" font-size="10" letter-spacing="1.5" fill="#6f8fb0" text-anchor="end">WORK TYPE → WHERE IT RUNS</text>
  <line x1="0" y1="36" x2="760" y2="36" stroke="#385a7b"/>

  <text x="40" y="62" font-size="9" letter-spacing="1.5" fill="#6f8fb0">THE WORK</text>
  <text x="440" y="62" font-size="9" letter-spacing="1.5" fill="#6f8fb0">WHERE IT RUNS</text>

  <rect x="40" y="76" width="320" height="52" fill="#21466a" stroke="#68839d"/>
  <text x="56" y="98" font-size="10" letter-spacing="1" fill="#e8f1fa">GITHUB CODE, NO SECRETS</text>
  <text x="56" y="116" font-size="9" fill="#a7c0d9">refactors · migrations · tests · docs</text>
  <line x1="360" y1="102" x2="436" y2="102" stroke="#c3d7ea" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="440" y="76" width="280" height="52" fill="#21466a" stroke="#68839d"/>
  <text x="456" y="98" font-size="10" letter-spacing="1" fill="#e8f1fa">CLOUD THREAD</text>
  <text x="456" y="116" font-size="9" fill="#a7c0d9">own branch, opens a PR</text>

  <rect x="40" y="146" width="320" height="52" fill="#21466a" stroke="#68839d"/>
  <text x="56" y="168" font-size="10" letter-spacing="1" fill="#e8f1fa">NEEDS SECRETS, A HOST, LOCAL TOOLS</text>
  <text x="56" y="186" font-size="9" fill="#a7c0d9">secret manager · home server · local db</text>
  <line x1="360" y1="172" x2="436" y2="172" stroke="#c3d7ea" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="440" y="146" width="280" height="52" fill="#21466a" stroke="#68839d"/>
  <text x="456" y="168" font-size="10" letter-spacing="1" fill="#e8f1fa">LOCAL THREAD OR NORMAL SESSION</text>
  <text x="456" y="186" font-size="9" fill="#a7c0d9">your hooks and permission rules apply</text>

  <rect x="40" y="216" width="320" height="52" fill="#21466a" stroke="#68839d"/>
  <text x="56" y="238" font-size="10" letter-spacing="1" fill="#e8f1fa">CLIENT NDA OR PERSONAL DATA</text>
  <text x="56" y="256" font-size="9" fill="#a7c0d9">contracts · client code · people data</text>
  <line x1="360" y1="242" x2="436" y2="242" stroke="#c3d7ea" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="440" y="216" width="280" height="52" fill="#21466a" stroke="#e8c56a" stroke-width="1.5"/>
  <text x="456" y="238" font-size="10" letter-spacing="1" fill="#e8c56a">LOCAL SESSION ONLY</text>
  <text x="456" y="256" font-size="9" fill="#a7c0d9">never a cloud Project</text>
</svg>
