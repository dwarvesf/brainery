<title>Ten turns of a real pi-fabric run: calls inside each program and characters returned to the model</title><desc>Ten columns, one per turn of run S2-fabric. Each shows the calls inside that turn's program, a bar for the characters that came back into context, and tokens in and out. Turn 2 returned 16,700 characters. Turns 3, 5, 8 and 9 returned under 220 each. The turn 7 bar, a bug fix, is amber. Nine programs succeeded, 19,006 tokens in, 7,014 out, 0.0053 dollars. 29,235 characters came back in total.</desc><defs><pattern id="f4g" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#e8f1fa" stroke-opacity="0.05"/></pattern><marker id="f4a" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L8 4L0 8z" fill="#c3d7ea"/></marker><marker id="f4am" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L8 4L0 8z" fill="#e8c56a"/></marker><marker id="f4ad" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L8 4L0 8z" fill="#6f8fb0"/></marker></defs>
