  <text x="628" y="239.4" font-size="9" fill="#e8c56a">90k per run · 3.6M</text>
  <text x="628" y="317.4" font-size="9" fill="#e8c56a">15k per run · 0.6M</text>
  <line x1="376.4" y1="292.6" x2="376.4" y2="330" stroke="#e8c56a" stroke-opacity="0.6" style="stroke-dasharray:3 3"/>
  <circle cx="376.4" cy="292.6" r="5" fill="#12395f" stroke="#e8c56a" stroke-width="2"/>
  <line x1="376.4" y1="285.6" x2="376.4" y2="244.6" stroke="#e8c56a"/>
  <text x="384.4" y="222.6" font-size="10" fill="#e8c56a" text-anchor="end">16 tickets a day at 90k</text>
  <text x="384.4" y="236.6" font-size="10" fill="#e8f1fa" text-anchor="end">equals the timer's lowest day</text>
  <text x="70" y="392" font-size="9" fill="#6f8fb0">the timer pays for all 96 runs whether or not anything changed; at 15k per run</text>
  <text x="70" y="405" font-size="9" fill="#6f8fb0">a trigger matches its lowest day only at 96 tickets a day, off this chart</text>
