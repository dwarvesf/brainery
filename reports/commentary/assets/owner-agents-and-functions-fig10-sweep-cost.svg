  <text x="62" y="73.0" font-size="9" fill="#6f8fb0" text-anchor="end">10M</text>
  <line x1="70" y1="330" x2="620" y2="330" stroke="#68839d"/>
  <line x1="70" y1="70" x2="70" y2="330" stroke="#68839d"/>
  <line x1="196" y1="70" x2="196" y2="330" stroke="#385a7b"/>
  <text x="70" y="56" font-size="9" letter-spacing="1.5" fill="#6f8fb0">TOKENS PER DAY</text>
  <rect x="108" y="105.4" width="44" height="187.2" fill="#68839d" stroke="#c3d7ea"/>
  <text x="130" y="99.4" font-size="10" fill="#e8f1fa" text-anchor="middle">8.64M</text>
  <text x="130" y="306.6" font-size="10" fill="#e8f1fa" text-anchor="middle">1.44M</text>
