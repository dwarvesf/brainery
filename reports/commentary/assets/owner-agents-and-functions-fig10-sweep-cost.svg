  <text x="218" y="285.6" font-size="9" fill="#c3d7ea">timer's lowest day: 1.44M</text>
  <polygon points="214.0,330 620.0,236.4 620.0,314.4" fill="#e8c56a" fill-opacity="0.22"/>
