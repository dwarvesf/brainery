<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 414" style="width:100%;height:auto;max-width:760px;display:block" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-labelledby="t d">
  <title id="t">Fig. 10 timer versus trigger token cost</title>
  <desc id="d">Tokens per day against new tickets per day. A 15 minute timer runs 96 times a day at 15k to 90k tokens per run, 1.44M to 8.64M tokens a day, whether or not anything changed. A trigger runs once per new ticket, 0.6M to 3.6M tokens a day at 40 tickets. At 90k tokens per run the trigger matches the timer's lowest day at 16 tickets a day. At 15k per run it matches it at 96 tickets a day.</desc>
  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#e8f1fa" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c3d7ea"/>
    </marker>
  </defs>
  <rect width="760" height="414" fill="#12395f"/>
  <rect width="760" height="414" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="759" height="413" fill="none" stroke="#68839d"/>
  <text x="14" y="24" font-size="10" letter-spacing="1.5" fill="#c3d7ea">FIG. 10 · TIMER VS TRIGGER</text>
  <text x="746" y="24" font-size="10" letter-spacing="1.5" fill="#6f8fb0" text-anchor="end">COMPUTED FROM THE PER-RUN RANGE, NOT MEASURED</text>
