  <line x1="70" y1="200.0" x2="620" y2="200.0" stroke="#385a7b" stroke-opacity="0.6"/>
  <text x="62" y="203.0" font-size="9" fill="#6f8fb0" text-anchor="end">5M</text>
  <line x1="70" y1="135.0" x2="620" y2="135.0" stroke="#385a7b" stroke-opacity="0.6"/>
  <text x="62" y="138.0" font-size="9" fill="#6f8fb0" text-anchor="end">7.5M</text>
