<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" style="width:100%;height:auto;max-width:760px;display:block" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-labelledby="t d">
  <title id="t">Fig. 4 multi-agent change versus a single agent</title>
  <desc id="d">Horizontal bars of the change from using several agents instead of one. Research gained 90.2 percent (Anthropic). Decomposable finance gained up to 80.8 percent (Kim et al.). Sequential planning lost 39 to 70 percent (Kim et al.). Two-agent coding lost about 30 percent (CooperBench).</desc>
  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#e8f1fa" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c3d7ea"/>
    </marker>
  </defs>
  <rect width="760" height="392" fill="#12395f"/>
  <rect width="760" height="392" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="759" height="391" fill="none" stroke="#68839d"/>
  <text x="14" y="24" font-size="10" letter-spacing="1.5" fill="#c3d7ea">FIG. 4 · EVIDENCE SCOREBOARD</text>
  <text x="746" y="24" font-size="10" letter-spacing="1.5" fill="#6f8fb0" text-anchor="end">MULTI-AGENT VS ONE AGENT, BY TASK SHAPE</text>
  <line x1="0" y1="36" x2="760" y2="36" stroke="#385a7b"/>
  <text x="482" y="64" font-size="9" letter-spacing="1.5" fill="#6f8fb0" text-anchor="end">← WORSE</text>
  <text x="498" y="64" font-size="9" letter-spacing="1.5" fill="#6f8fb0">BETTER →</text>
  <line x1="270.0" y1="76" x2="270.0" y2="314" stroke="#385a7b" stroke-opacity="0.6"/>
  <line x1="380.0" y1="76" x2="380.0" y2="314" stroke="#385a7b" stroke-opacity="0.6"/>
  <line x1="600.0" y1="76" x2="600.0" y2="314" stroke="#385a7b" stroke-opacity="0.6"/>
  <line x1="710.0" y1="76" x2="710.0" y2="314" stroke="#385a7b" stroke-opacity="0.6"/>
  <text x="270.0" y="332" font-size="9" fill="#6f8fb0" text-anchor="middle">-100%</text>
  <text x="380.0" y="332" font-size="9" fill="#6f8fb0" text-anchor="middle">-50%</text>
  <text x="490.0" y="332" font-size="9" fill="#6f8fb0" text-anchor="middle">0</text>
  <text x="600.0" y="332" font-size="9" fill="#6f8fb0" text-anchor="middle">+50%</text>
  <text x="710.0" y="332" font-size="9" fill="#6f8fb0" text-anchor="middle">+100%</text>
  <text x="24" y="106" font-size="10" fill="#e8f1fa">research</text>
  <text x="24" y="120" font-size="9" fill="#6f8fb0">Anthropic</text>
  <rect x="490.0" y="96" width="198.4" height="24" fill="#a7c0d9"/>
  <text x="696.4" y="112" font-size="10" fill="#e8f1fa">+90.2%</text>
  <text x="24" y="168" font-size="10" fill="#e8f1fa">decomposable finance</text>
  <text x="24" y="182" font-size="9" fill="#6f8fb0">Kim et al., best case</text>
  <rect x="490.0" y="158" width="177.8" height="24" fill="#a7c0d9"/>
  <text x="675.8" y="174" font-size="10" fill="#e8f1fa">+80.8%</text>
  <text x="24" y="230" font-size="10" fill="#e8f1fa">sequential planning</text>
  <text x="24" y="244" font-size="9" fill="#6f8fb0">Kim et al., every variant</text>
  <rect x="336.0" y="220" width="68.2" height="24" fill="#21466a" stroke="#c3d7ea"/>
  <text x="500" y="236" font-size="10" fill="#e8f1fa">-39% to -70%</text>
  <text x="24" y="292" font-size="10" fill="#e8f1fa">two-agent coding</text>
  <text x="24" y="306" font-size="9" fill="#6f8fb0">CooperBench</text>
  <rect x="424.0" y="282" width="66.0" height="24" fill="#21466a" stroke="#c3d7ea"/>
  <text x="500" y="298" font-size="10" fill="#e8f1fa">about -30%</text>
  <line x1="490" y1="70" x2="490" y2="314" stroke="#e8c56a" stroke-width="2"/>
