<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 408" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-labelledby="t d">
  <title id="t">Fig. 3 idle minutes of the thread when I came back, after a switch versus staying</title>
  <desc id="d">Dot-range plot on a log scale from 1 to 200 minutes. After a switch: p50 5.4, p75 23.6, p90 171 minutes. Stayed in the same session: p50 1.6, p75 3.9, p90 9.7 minutes. The switch row is emphasised. 23% of switches land on a thread idle over 30 minutes, against 4% when staying.</desc>
