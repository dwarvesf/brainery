<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 404" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-labelledby="t d">
  <title id="t">Fig. 3 agent wait against human utilisation, M/M/1</title>
  <desc id="d">Line chart of agent wait in review-lengths, Wq = rho / (1 - rho), for utilisation rho from 0.30 to 0.95. Marked points: 50% busy waits 1.0, 70% waits 2.3 (highlighted as the knee), 80% waits 4, 90% waits 9, 95% waits 19. A shaded band from 0.4 to 0.7 is labelled healthy.</desc>
  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#e8f1fa" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c3d7ea"/>
    </marker>
    <marker id="arrdim" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6f8fb0"/>
    </marker>
  </defs>
