<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 448" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-labelledby="t d">
  <title id="t">Fig. 3 agent wait against human utilisation, M/M/1</title>
  <desc id="d">Line chart of agent wait in review-lengths, Wq = rho / (1 - rho), for utilisation rho from 0.30 to 0.95. Marked points: 50% busy waits 1.0, 70% waits 2.3 (emphasised as the knee), 80% waits 4, 90% waits 9, 95% waits 19. A shaded band from 0.4 to 0.7 is labelled healthy.</desc>
