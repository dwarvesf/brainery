<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" style="width:100%;height:auto;max-width:760px;display:block" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0 H0 V20" fill="none" stroke="#385a7b" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="760" height="300" fill="#12395f"/>
  <rect width="760" height="300" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="759" height="299" fill="none" stroke="#68839d"/>
  <text x="16" y="24" fill="#a7c0d9" font-size="10" letter-spacing="2">FIG. 1 · COST PER 30 SECONDS</text>
  <text x="744" y="24" fill="#6f8fb0" font-size="10" letter-spacing="2" text-anchor="end">ONE BUILDER'S LADDER</text>
  <line x1="16" y1="36" x2="744" y2="36" stroke="#68839d"/>

  <!-- axis: $0 at x=200, $14 at x=700 => 35.7px per dollar -->
  <line x1="200" y1="60" x2="200" y2="236" stroke="#68839d"/>
  <line x1="200" y1="236" x2="720" y2="236" stroke="#68839d"/>
  <text x="200" y="254" fill="#6f8fb0" font-size="10" text-anchor="middle">$0</text>
  <text x="379" y="254" fill="#6f8fb0" font-size="10" text-anchor="middle">$5</text>
  <text x="557" y="254" fill="#6f8fb0" font-size="10" text-anchor="middle">$10</text>
  <text x="700" y="254" fill="#6f8fb0" font-size="10" text-anchor="middle">$14</text>
  <line x1="379" y1="60" x2="379" y2="236" stroke="#385a7b" stroke-opacity="0.6"/>
  <line x1="557" y1="60" x2="557" y2="236" stroke="#385a7b" stroke-opacity="0.6"/>

  <!-- bar 1: hosted $14 -->
  <text x="188" y="92" fill="#e8f1fa" font-size="11" text-anchor="end">hosted path</text>
  <text x="188" y="106" fill="#6f8fb0" font-size="10" text-anchor="end">all seconds generated</text>
  <rect x="200" y="78" width="500" height="30" fill="#21466a" stroke="#68839d"/>
  <text x="708" y="98" fill="#c3d7ea" font-size="12">$14</text>

  <!-- bar 2: keyframing $5 -->
  <text x="188" y="146" fill="#e8f1fa" font-size="11" text-anchor="end">keyframing</text>
  <text x="188" y="160" fill="#6f8fb0" font-size="10" text-anchor="end">generate K of N frames</text>
  <rect x="200" y="132" width="179" height="30" fill="#21466a" stroke="#68839d"/>
  <text x="387" y="152" fill="#c3d7ea" font-size="12">$5</text>

  <!-- bar 3: own stack $2 (amber) -->
  <text x="188" y="200" fill="#e8c56a" font-size="11" text-anchor="end">own stack</text>
  <text x="188" y="214" fill="#6f8fb0" font-size="10" text-anchor="end">composite on a GPU burst</text>
  <rect x="200" y="186" width="71" height="30" fill="#21466a" stroke="#e8c56a" stroke-width="2"/>
  <text x="279" y="206" fill="#e8c56a" font-size="12">$2</text>
  <text x="310" y="206" fill="#a7c0d9" font-size="10">+ ~40 GPUs x 200 CPUs for 30-90 s</text>

  <!-- footer -->
  <text x="380" y="282" fill="#c3d7ea" font-size="11" text-anchor="middle">Move seconds from generation to compositing: the bill drops 7x, the compute burst pays for it.</text>
</svg>
