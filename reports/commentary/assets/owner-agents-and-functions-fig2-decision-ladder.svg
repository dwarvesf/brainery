<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 474" style="width:100%;height:auto;max-width:760px;display:block" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-labelledby="t d">
  <title id="t">Fig. 2 decision ladder for a lab item</title>
  <desc id="d">Questions route an item to one of five rungs. Listable steps with no judgment input go to L0, a plain function. Listable steps with free text go to L1, a workflow with one typed LLM step. Unlistable steps go to L2, one owner agent, or L3 when work overflows one context or splits into read-only parts. L4, peer agents, is avoided.</desc>
  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#e8f1fa" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c3d7ea"/>
    </marker>
  </defs>
  <rect width="760" height="474" fill="#12395f"/>
  <rect width="760" height="474" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="759" height="473" fill="none" stroke="#68839d"/>
  <text x="14" y="24" font-size="10" letter-spacing="1.5" fill="#c3d7ea">FIG. 2 · DECISION LADDER</text>
  <text x="746" y="24" font-size="10" letter-spacing="1.5" fill="#6f8fb0" text-anchor="end">QUESTIONS ROUTE TO THE LOWEST RUNG THAT WORKS</text>
  <line x1="0" y1="36" x2="760" y2="36" stroke="#385a7b"/>
  <rect x="504" y="56" width="232" height="52" fill="#21466a" stroke="#68839d" stroke-width="1"/>
  <text x="518" y="78" font-size="10" letter-spacing="0.5" fill="#e8f1fa">L0 · FUNCTION</text>
  <text x="518" y="96" font-size="9" fill="#a7c0d9">plain function or cron script</text>
  <rect x="504" y="122" width="232" height="52" fill="#21466a" stroke="#68839d" stroke-width="1"/>
  <text x="518" y="144" font-size="10" letter-spacing="0.5" fill="#e8f1fa">L1 · WORKFLOW + TYPED LLM STEP</text>
  <text x="518" y="162" font-size="9" fill="#a7c0d9">model returns JSON, code writes</text>
  <rect x="504" y="188" width="232" height="52" fill="#21466a" stroke="#e8c56a" stroke-width="2"/>
  <text x="518" y="210" font-size="10" letter-spacing="0.5" fill="#e8c56a">L2 · OWNER AGENT</text>
  <text x="518" y="228" font-size="9" fill="#c3d7ea">tools, bounded loop</text>
  <rect x="504" y="254" width="232" height="52" fill="#21466a" stroke="#68839d" stroke-width="1"/>
  <text x="518" y="276" font-size="10" letter-spacing="0.5" fill="#e8f1fa">L3 · OWNER + READ-ONLY HELPERS</text>
  <text x="518" y="294" font-size="9" fill="#a7c0d9">fan-out reads, owner writes</text>
  <rect x="504" y="320" width="232" height="52" fill="#12395f" stroke="#4a6b8c" stroke-width="1" style="stroke-dasharray:4 3"/>
  <text x="518" y="342" font-size="10" letter-spacing="0.5" fill="#6f8fb0">L4 · PEER AGENTS</text>
  <text x="518" y="360" font-size="9" fill="#6f8fb0">avoid: writers that negotiate</text>
  <rect x="24" y="170" width="140" height="60" fill="#21466a" stroke="#68839d" stroke-width="1"/>
  <text x="94" y="196" font-size="10" fill="#e8f1fa" text-anchor="middle">Can I list the</text>
  <text x="94" y="212" font-size="10" fill="#e8f1fa" text-anchor="middle">steps today?</text>
  <rect x="244" y="84" width="200" height="60" fill="#21466a" stroke="#68839d" stroke-width="1"/>
  <text x="344" y="110" font-size="10" fill="#e8f1fa" text-anchor="middle">Any input free text</text>
  <text x="344" y="126" font-size="10" fill="#e8f1fa" text-anchor="middle">or a judgment call?</text>
  <rect x="244" y="230" width="200" height="60" fill="#21466a" stroke="#68839d" stroke-width="1"/>
  <text x="344" y="256" font-size="10" fill="#e8f1fa" text-anchor="middle">Overflows one context, or</text>
  <text x="344" y="272" font-size="10" fill="#e8f1fa" text-anchor="middle">read-only parallel parts?</text>
  <path d="M 164 186 L 196 186 L 196 114 L 242 114" fill="none" stroke="#c3d7ea" marker-end="url(#arr)"/>
  <text x="202" y="152" font-size="9" letter-spacing="1" fill="#6f8fb0">yes</text>
  <path d="M 164 214 L 196 214 L 196 260 L 242 260" fill="none" stroke="#c3d7ea" marker-end="url(#arr)"/>
  <text x="202" y="240" font-size="9" letter-spacing="1" fill="#6f8fb0">no</text>
  <path d="M 444 100 L 474 100 L 474 82 L 502 82" fill="none" stroke="#c3d7ea" marker-end="url(#arr)"/>
  <text x="448" y="95" font-size="9" letter-spacing="1" fill="#6f8fb0">no</text>
  <path d="M 444 128 L 474 128 L 474 148 L 502 148" fill="none" stroke="#c3d7ea" marker-end="url(#arr)"/>
  <text x="448" y="141" font-size="9" letter-spacing="1" fill="#6f8fb0">yes</text>
  <path d="M 444 250 L 474 250 L 474 214 L 502 214" fill="none" stroke="#c3d7ea" marker-end="url(#arr)"/>
  <text x="448" y="245" font-size="9" letter-spacing="1" fill="#6f8fb0">no</text>
  <path d="M 444 274 L 474 274 L 474 280 L 502 280" fill="none" stroke="#c3d7ea" marker-end="url(#arr)"/>
  <text x="448" y="288" font-size="9" letter-spacing="1" fill="#6f8fb0">yes</text>
  <text x="24" y="402" font-size="9" letter-spacing="1.5" fill="#6f8fb0">TWO GUARDS THAT APPLY ON ANY AGENT RUNG</text>
  <rect x="24" y="412" width="350" height="48" fill="#21466a" stroke="#68839d" stroke-width="1"/>
  <text x="40" y="432" font-size="10" letter-spacing="0.5" fill="#e8f1fa">MONEY OR IRREVERSIBLE STATE?</text>
  <text x="40" y="449" font-size="9" fill="#a7c0d9">the agent proposes; code and a human execute</text>
  <rect x="386" y="412" width="350" height="48" fill="#21466a" stroke="#68839d" stroke-width="1"/>
  <text x="402" y="432" font-size="10" letter-spacing="0.5" fill="#e8f1fa">RUNS OFTEN, USUALLY NOTHING NEW?</text>
  <text x="402" y="449" font-size="9" fill="#a7c0d9">a script watches, wakes the agent on a change</text>
</svg>
