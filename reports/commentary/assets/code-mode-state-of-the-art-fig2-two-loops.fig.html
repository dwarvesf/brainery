<figure class="fig"><div class="fig-body">
<svg role="group" aria-label="Two loops as a state diagram: the model reads, thinks and writes one program; the sandbox runs it with no model; only the return value goes back" data-fk="graph" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 412" style="width:100%;height:auto;max-width:760px;display:block" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
<defs><pattern id="f2g" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#e8f1fa" stroke-opacity="0.05"/></pattern><marker id="f2a" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L8 4L0 8z" fill="#c3d7ea"/></marker><marker id="f2am" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L8 4L0 8z" fill="#e8c56a"/></marker><marker id="f2ad" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L8 4L0 8z" fill="#6f8fb0"/></marker></defs>
<rect width="760" height="412" fill="#12395f"/>
<rect width="760" height="412" fill="url(#f2g)"/>
<rect x="0.5" y="0.5" width="759" height="411" fill="none" stroke="#68839d"/>
<text x="14" y="24" font-size="10" letter-spacing="1.5" fill="#c3d7ea">FIG. 2 · TWO LOOPS</text>
<text x="746" y="24" font-size="10" letter-spacing="1.5" fill="#6f8fb0" text-anchor="end">WHO THINKS, WHO RUNS</text>
<line x1="0" y1="36" x2="760" y2="36" stroke="#385a7b"/>
<rect x="24" y="52" width="216" height="304" fill="none" stroke="#6f8fb0" style="stroke-dasharray:5 4" rx="12"/><text x="38" y="69" font-size="9" fill="#6f8fb0" letter-spacing="1">THE MODEL · costs tokens</text><rect x="520" y="52" width="216" height="304" fill="none" stroke="#6f8fb0" style="stroke-dasharray:5 4" rx="12"/><text x="534" y="69" font-size="9" fill="#6f8fb0" letter-spacing="1">SANDBOX, NO MODEL</text><g data-fk-node="read" data-tip="Outer loop, step 1: the model reads the history plus the result of the last program. Tokens are spent here." data-animate="sequence" data-step="0"><rect x="52" y="84" width="160" height="46" fill="#21466a" stroke="#68839d" rx="10"/><text x="132.0" y="103" font-size="10.5" fill="#e8f1fa" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-weight="600">read history</text><text x="132.0" y="118" font-size="9" fill="#6f8fb0" text-anchor="middle">+ last result</text></g><g data-fk-node="think" data-tip="Outer loop, step 2: the model decides what to do next. One pass takes seconds." data-animate="sequence" data-step="1"><rect x="52" y="190" width="160" height="46" fill="#21466a" stroke="#68839d" rx="10"/><text x="132.0" y="209" font-size="10.5" fill="#e8f1fa" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-weight="600">think</text><text x="132.0" y="224" font-size="9" fill="#6f8fb0" text-anchor="middle">seconds per pass</text></g><g data-fk-node="write" data-tip="Outer loop, step 3: the model writes one program, not one call at a time." data-animate="sequence" data-step="2"><rect x="52" y="296" width="160" height="46" fill="#21466a" stroke="#68839d" rx="10"/><text x="132.0" y="315" font-size="10.5" fill="#e8f1fa" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-weight="600">write program</text><text x="132.0" y="330" font-size="9" fill="#6f8fb0" text-anchor="middle">plain code</text></g><g data-fk-node="run" data-tip="Inner loop, step 1: the sandbox runs the program and makes the tool calls. No model is involved, so no tokens are spent." data-animate="sequence" data-step="4"><rect x="548" y="296" width="160" height="46" fill="#21466a" stroke="#68839d" rx="10"/><text x="628.0" y="315" font-size="10.5" fill="#e8f1fa" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-weight="600">run tool calls</text><text x="628.0" y="330" font-size="9" fill="#6f8fb0" text-anchor="middle">no tokens</text></g><g data-fk-node="branch" data-tip="Inner loop, step 2: the program chooses a path with plain if and else." data-animate="sequence" data-step="5"><rect x="548" y="224" width="160" height="46" fill="#21466a" stroke="#68839d" rx="10"/><text x="628.0" y="243" font-size="10.5" fill="#e8f1fa" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-weight="600">branch</text><text x="628.0" y="258" font-size="9" fill="#6f8fb0" text-anchor="middle">if / else</text></g><g data-fk-node="loop" data-tip="Inner loop, step 3: the program repeats the work over many items. Every pass is milliseconds, with no model." data-animate="sequence" data-step="6"><rect x="548" y="152" width="160" height="46" fill="#21466a" stroke="#68839d" rx="10"/><text x="628.0" y="171" font-size="10.5" fill="#e8f1fa" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-weight="600">loop</text><text x="628.0" y="186" font-size="9" fill="#6f8fb0" text-anchor="middle">for each item</text></g><g data-fk-node="return" data-tip="Inner loop, step 4: the program ends with a return value. Intermediate results (file text, API JSON, test logs) stay in the sandbox." data-animate="sequence" data-step="7"><rect x="548" y="80" width="160" height="46" fill="#21466a" stroke="#68839d" rx="10"/><text x="628.0" y="99" font-size="10.5" fill="#e8f1fa" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-weight="600">return</text><text x="628.0" y="114" font-size="9" fill="#6f8fb0" text-anchor="middle">the value</text></g><g data-fk-edge="read think" data-tip="The model has the context it needs."><path d="M132 130V188" fill="none" stroke="#c3d7ea" stroke-width="1.3" marker-end="url(#f2a)" data-animate="draw" data-step="0.5"/><text x="142" y="164" font-size="9" fill="#c3d7ea">context</text></g><g data-fk-edge="think write" data-tip="The plan is settled; time to write it down as code."><path d="M132 236V294" fill="none" stroke="#c3d7ea" stroke-width="1.3" marker-end="url(#f2a)" data-animate="draw" data-step="1.5"/><text x="142" y="270" font-size="9" fill="#c3d7ea">plan</text></g><g data-fk-edge="write run" data-tip="Only the program crosses over, as one piece of text."><path d="M214 319H546" fill="none" stroke="#c3d7ea" stroke-width="1.3" marker-end="url(#f2a)" data-animate="draw" data-step="3"/><text x="380" y="311" font-size="9" fill="#c3d7ea" text-anchor="middle">one program</text></g><g data-fk-edge="run branch" data-tip="A tool result comes back to the program, not to the model."><path d="M628 294V272" fill="none" stroke="#c3d7ea" stroke-width="1.3" marker-end="url(#f2a)" data-animate="draw" data-step="4.5"/><text x="636" y="286" font-size="9" fill="#c3d7ea">result</text></g><g data-fk-edge="branch loop" data-tip="The program keeps going while there is more work."><path d="M628 222V200" fill="none" stroke="#c3d7ea" stroke-width="1.3" marker-end="url(#f2a)" data-animate="draw" data-step="5.5"/><text x="636" y="214" font-size="9" fill="#c3d7ea">more</text></g><g data-fk-edge="loop return" data-tip="The loop is finished and the program returns."><path d="M628 150V128" fill="none" stroke="#c3d7ea" stroke-width="1.3" marker-end="url(#f2a)" data-animate="draw" data-step="6.5"/><text x="636" y="142" font-size="9" fill="#c3d7ea">done</text></g><g data-fk-edge="return read" data-tip="Only the return value goes back to the model. This is the whole point of code mode."><path d="M546 103H214" fill="none" stroke="#e8c56a" stroke-width="1.8" marker-end="url(#f2am)" data-animate="draw" data-step="8"/><text x="380" y="95" font-size="9" fill="#e8c56a" text-anchor="middle">return value only</text></g><text x="380" y="392" font-size="9.5" fill="#c3d7ea" text-anchor="middle">the model thinks in the outer loop; plain code runs in the inner loop</text>
</svg>
<div data-fk-controls hidden>
<span data-fk-walk="read think write run branch loop return read" data-fk-label="Step through"></span>
</div>
</div></figure>
