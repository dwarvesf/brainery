  <title id="t">Fig. 3 chain reliability by per-step success rate</title>
  <desc id="d">Line chart of p to the power H for per-step success p of 0.99, 0.95 and 0.90 over 1 to 50 steps. At p 0.95 and 20 steps the chain succeeds 36 percent of the time. At 50 steps the three lines end at about 61, 8 and 0.5 percent.</desc>
