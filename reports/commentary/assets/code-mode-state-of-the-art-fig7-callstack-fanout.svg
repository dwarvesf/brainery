ker-end="url(#f7a)"/><rect x="379.8" y="360" width="66.5" height="12" fill="#12395f"/><text x="413.0" y="370" font-size="9" fill="#c3d7ea" text-anchor="middle">done +18 ms</text></g><g><line x1="420" y1="404" x2="261" y2="404" stroke="#c3d7ea" stroke-width="1.2" style="stroke-dasharray:4 3" marker-end="url(#f7a)"/><rect x="305.8" y="388" width="66.5" height="12" fill="#12395f"/><text x="339.0" y="398" font-size="9" fill="#c3d7ea" text-anchor="middle">done +26 ms</text></g><g><line x1="706" y1="432" x2="261" y2="432" stroke="#c3d7ea" stroke-width="1.2" style="stroke-dasharray:4 3" marker-end="url(#f7a)"/><rect x="448.8" y="416" width="66.5" height="12" fill="#12395f"/><text x="482.0" y="426" font-size="9" fill="#c3d7ea" text-anchor="middle">done +32 ms</text></g><g><line x1="258" y1="462" x2="99" y2="462" stroke="#e8c56a" stroke-width="1.8" style="stroke-dasharray:4 3" marker-end="url(#f7am)"/><rect x="149.2" y="446" width="55.5" height="12" fill="#12395f"/><text x="177.0" y="456" font-size="9" fill="#e8c56a" text-anchor="middle">3 results</text></g><rect x="40" y="218" width="112" height="34" fill="#12395f" stroke="#6f8fb0" style="stroke-dasharray:3 3" rx="6"/><text x="96.0" y="238.0" font-size="9" fill="#a7c0d9" text-anchor="middle">parked on await</text><rect x="40" y="476" width="112" height="22" fill="#12395f" stroke="#6f8fb0" style="stroke-dasharray:3 3" rx="6"/><text x="96.0" y="490.0" font-size="9" fill="#a7c0d9" text-anchor="middle">resumes</text><text x="24" y="556" font-size="9" fill="#c3d7ea">program, S2-rep1 turn 1:  const [src, test, readme] = await Promise.all([pi.read(...), pi.read(...), pi.read(...)]);</text>
