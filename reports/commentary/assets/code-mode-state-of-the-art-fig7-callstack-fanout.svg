<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" style="width:100%;height:auto;max-width:760px;display:block" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
<title>Sequence diagram of a Promise.all turn: three read calls fired together, replies in completion order, then the program resumes</title><desc>A sequence diagram with five lifelines: the program in a sandbox, the bridge, and three reads, src, test and README. The program fires three pi.read calls across the sandbox boundary, shown in the accent color. The bridge returns three promise handles at once and the program parks on one await. The three reads start together at plus 5, 5 and 6 milliseconds, then finish in order: test at plus 18, src at plus 26, README at plus 32. The three results cross back in the accent color in call order and the program resumes.</desc><defs><pattern id="f7g" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#e8f1fa" stroke-opacity="0.05"/></pattern><marker id="f7a" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L8 4L0 8z" fill="#c3d7ea"/></marker><marker id="f7am" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L8 4L0 8z" fill="#e8c56a"/></marker><marker id="f7ad" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L8 4L0 8z" fill="#6f8fb0"/></marker></defs>
