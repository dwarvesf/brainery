<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" style="width:100%;height:auto;max-width:760px;display:block" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c3d7ea"/>
    </marker>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0 H0 V20" fill="none" stroke="#385a7b" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="760" height="300" fill="#12395f"/>
  <rect width="760" height="300" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="759" height="299" fill="none" stroke="#68839d"/>
  <text x="16" y="24" fill="#a7c0d9" font-size="10" letter-spacing="2">FIG. 1 · THE FARMER-WHALE LOOP</text>
  <text x="744" y="24" fill="#6f8fb0" font-size="10" letter-spacing="2" text-anchor="end">SKETCH FROM THE THREAD</text>
  <line x1="16" y1="36" x2="744" y2="36" stroke="#68839d"/>

  <!-- Farmers -->
  <rect x="40" y="110" width="170" height="80" rx="4" fill="#21466a" stroke="#68839d"/>
  <text x="125" y="140" fill="#e8f1fa" font-size="13" text-anchor="middle">FARMERS</text>
  <text x="125" y="160" fill="#a7c0d9" font-size="11" text-anchor="middle">20 accounts each</text>
  <text x="125" y="176" fill="#6f8fb0" font-size="10" text-anchor="middle">sell early-game resources</text>

  <!-- Market -->
  <rect x="295" y="110" width="170" height="80" rx="4" fill="#21466a" stroke="#68839d"/>
  <text x="380" y="140" fill="#e8f1fa" font-size="13" text-anchor="middle">MARKETPLACE</text>
  <text x="380" y="160" fill="#a7c0d9" font-size="11" text-anchor="middle">exchangeable (monotykamary)</text>
  <text x="380" y="176" fill="#6f8fb0" font-size="10" text-anchor="middle">player-to-player trade</text>

  <!-- Whales -->
  <rect x="550" y="110" width="170" height="80" rx="4" fill="#21466a" stroke="#68839d"/>
  <text x="635" y="140" fill="#e8f1fa" font-size="13" text-anchor="middle">RICH PLAYERS</text>
  <text x="635" y="160" fill="#a7c0d9" font-size="11" text-anchor="middle">money</text>
  <text x="635" y="176" fill="#6f8fb0" font-size="10" text-anchor="middle">paid a lot, so they stay (bievh)</text>

  <!-- arrows farmer -> market -> whale -->
  <line x1="210" y1="150" x2="293" y2="150" stroke="#c3d7ea" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="252" y="142" fill="#c3d7ea" font-size="10" text-anchor="middle">sell</text>
  <line x1="465" y1="150" x2="548" y2="150" stroke="#c3d7ea" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="507" y="142" fill="#c3d7ea" font-size="10" text-anchor="middle">buy</text>

  <!-- Publisher bridge (amber) -->
  <rect x="258" y="222" width="244" height="52" rx="4" fill="#21466a" stroke="#e8c56a" stroke-width="2"/>
  <text x="380" y="244" fill="#e8c56a" font-size="12" text-anchor="middle">PUBLISHER SELLS TIME</text>
  <text x="380" y="262" fill="#a7c0d9" font-size="10" text-anchor="middle">a shortcut instead of farming (tieubao)</text>
  <line x1="635" y1="190" x2="635" y2="248" stroke="#e8c56a" stroke-width="1.5"/>
  <line x1="635" y1="248" x2="504" y2="248" stroke="#e8c56a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="552" y="240" fill="#e8c56a" font-size="10" text-anchor="middle">cash</text>

  <!-- blocked cash-out -->
  <line x1="125" y1="190" x2="125" y2="248" stroke="#6f8fb0" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="125" y1="248" x2="256" y2="248" stroke="#6f8fb0" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="190" y="240" fill="#6f8fb0" font-size="10" text-anchor="middle">cash-out: fined (Decree 174)</text>
</svg>
