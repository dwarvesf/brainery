<title>Sequence diagram of one pi.read call in pi-fabric, from the model to the read tool and back</title><desc>A sequence diagram with seven lifelines: model, fabric_exec, type gate, program in a sandbox, bridge, pipeline and read tool. Messages in order: fabric_exec call, type-check, JS back, run, then pi.read crosses the sandbox boundary to the bridge in the accent color, the bridge passes it to the pipeline, which resolves and validates, invokes the read tool, and the file text returns. The result crosses back as JSON in the accent color, the program ends, and logs plus YAML go to the model.</desc><defs><pattern id="f6g" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#e8f1fa" stroke-opacity="0.05"/></pattern><marker id="f6a" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L8 4L0 8z" fill="#c3d7ea"/></marker><marker id="f6am" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L8 4L0 8z" fill="#e8c56a"/></marker><marker id="f6ad" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L8 4L0 8z" fill="#6f8fb0"/></marker></defs>
