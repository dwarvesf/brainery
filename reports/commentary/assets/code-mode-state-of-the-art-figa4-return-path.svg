<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="width:100%;height:auto;max-width:760px;display:block" role="img">
<title>Only printed output and the return value come back, capped at 50,000 characters</title>
<desc>A program-ends box with print logs and the return value as YAML flows through an amber cap of 50,000 characters, 20,000 on failure, into the model context. Overflow goes down to a file with mode 0600, and the next program can read it by range.</desc>
<defs>
