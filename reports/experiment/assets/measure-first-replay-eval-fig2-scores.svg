<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" style="width:100%;height:auto;max-width:760px;display:block" role="img" aria-label="Mean rubric score out of 14 per arm: raw model 9.0, raw plus skill 13.0, harness with measure question 10.7, harness without 12.3, harness plus skill 13.3, raw plus revised skill 12.7">
  <defs>
    <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#385a7b" stroke-width="1" opacity="0.6"/></pattern>
  </defs>
  <rect width="760" height="380" fill="#12395f"/>
  <rect width="760" height="380" fill="url(#g)"/>
  <rect x="0.5" y="0.5" width="759" height="379" fill="none" stroke="#68839d"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="20" y="24" font-size="10" letter-spacing="2" fill="#a7c0d9">FIG. 2 · RUBRIC SCORE BY ARM</text>
    <text x="740" y="24" font-size="10" letter-spacing="2" fill="#a7c0d9" text-anchor="end">MEAN OF 3 RUNS · MAX 14 · BAR = RANGE</text>
    <line x1="20" y1="36" x2="740" y2="36" stroke="#68839d"/>

    <!-- x axis: score 0..14 maps to x 260..700 (31.43 px per point) -->
    <g stroke="#385a7b" stroke-width="1" opacity="0.8">
      <line x1="260" y1="56" x2="260" y2="326"/>
      <line x1="417" y1="56" x2="417" y2="326"/>
      <line x1="574" y1="56" x2="574" y2="326"/>
      <line x1="700" y1="56" x2="700" y2="326"/>
    </g>
    <g font-size="10" fill="#6f8fb0" text-anchor="middle">
      <text x="260" y="344">0</text><text x="417" y="344">5</text><text x="574" y="344">10</text><text x="700" y="344">14</text>
    </g>

    <g font-size="11" fill="#c3d7ea">
      <text x="20" y="82">D raw model</text>
      <text x="20" y="124">E raw + skill</text>
      <text x="20" y="166">B harness, asks "how know"</text>
      <text x="20" y="208">C harness, no question</text>
      <text x="20" y="250">A harness + skill</text>
      <text x="20" y="292">F raw + revised skill</text>
    </g>

    <g>
      <rect x="260" y="70" width="283" height="16" fill="#68839d"/>
      <rect x="260" y="112" width="409" height="16" fill="#e8c56a"/>
      <rect x="260" y="154" width="336" height="16" fill="#68839d"/>
      <rect x="260" y="196" width="387" height="16" fill="#68839d"/>
      <rect x="260" y="238" width="418" height="16" fill="#68839d"/>
      <rect x="260" y="280" width="399" height="16" fill="#68839d"/>
    </g>
    <g stroke="#e8f1fa" stroke-width="2">
      <line x1="606" y1="200" x2="700" y2="200"/>
      <line x1="669" y1="242" x2="700" y2="242"/>
      <line x1="574" y1="158" x2="606" y2="158"/>
      <line x1="637" y1="284" x2="669" y2="284"/>
    </g>
    <g font-size="11" fill="#e8f1fa">
      <text x="551" y="83">9.0</text>
      <text x="677" y="125" fill="#e8c56a">13.0</text>
      <text x="614" y="167">10.7</text>
      <text x="655" y="209" fill="#e8f1fa" dx="50">12.3</text>
      <text x="706" y="251">13.3</text>
      <text x="667" y="293" dx="8">12.7</text>
    </g>
    <text x="380" y="366" font-size="10" fill="#a7c0d9" text-anchor="middle">Same day-0 problem, solution hidden; one blind Opus judge per batch; E and F re-judged together.</text>
  </g>
</svg>
