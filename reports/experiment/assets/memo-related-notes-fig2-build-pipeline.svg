<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-label="Fig. 2: the build-time pipeline. Eligible notes are hashed, only changed notes are embedded with bge-m3, the vectors are written as two static files, and each note's ring 1 is filled from links, then backlinks, then the nearest notes above a cosine of 0.65" style="width:100%;height:auto;max-width:760px;display:block" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <pattern id="grid2" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M 26 0 L 0 0 0 26" fill="none" stroke="#e8f1fa" stroke-opacity="0.05" stroke-width="1"/></pattern>
    <marker id="ar2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c3d7ea"/></marker>
  </defs>
  <rect width="760" height="440" fill="#12395f"/>
  <rect width="760" height="440" fill="url(#grid2)"/>
  <rect x="0.5" y="0.5" width="759" height="439" fill="none" stroke="#68839d"/>
  <text x="14" y="24" font-size="10" letter-spacing="1.5" fill="#c3d7ea">FIG. 2 · THE INDEX, BUILT ON EVERY DEPLOY</text>
  <text x="746" y="24" font-size="10" letter-spacing="1.5" fill="#6f8fb0" text-anchor="end">MEMO BUILD, BUILD TIME</text>
  <line x1="0" y1="36" x2="760" y2="36" stroke="#385a7b"/>

  <!-- row A: inputs -->
  <g stroke="#68839d" stroke-width="1" fill="#21466a">
    <rect x="20" y="58" width="150" height="54" rx="3"/>
    <rect x="200" y="58" width="150" height="54" rx="3"/>
    <rect x="380" y="58" width="170" height="54" rx="3"/>
    <rect x="580" y="58" width="160" height="54" rx="3"/>
  </g>
  <text x="95" y="81" font-size="11" fill="#e8f1fa" text-anchor="middle">1,202 note files</text>
  <text x="95" y="98" font-size="9" fill="#a7c0d9" text-anchor="middle">brainery vault</text>
  <text x="275" y="81" font-size="11" fill="#e8f1fa" text-anchor="middle">522 eligible</text>
  <text x="275" y="98" font-size="9" fill="#a7c0d9" text-anchor="middle">each has an Ask corpus</text>
  <text x="465" y="76" font-size="11" fill="#e8f1fa" text-anchor="middle">embed text</text>
  <text x="465" y="91" font-size="9" fill="#a7c0d9" text-anchor="middle">title, lead, headings,</text>
  <text x="465" y="103" font-size="9" fill="#a7c0d9" text-anchor="middle">sections; 6,000 chars</text>
  <text x="660" y="81" font-size="11" fill="#e8f1fa" text-anchor="middle">hash</text>
  <text x="660" y="98" font-size="9" fill="#a7c0d9" text-anchor="middle">sha256(model + text)</text>
  <g stroke="#c3d7ea" stroke-width="1.5" fill="none" marker-end="url(#ar2)">
    <line x1="170" y1="85" x2="198" y2="85"/>
    <line x1="350" y1="85" x2="378" y2="85"/>
    <line x1="550" y1="85" x2="578" y2="85"/>
    <line x1="660" y1="112" x2="660" y2="146"/>
  </g>

  <!-- decision, the one accent -->
  <rect x="570" y="148" width="170" height="54" rx="3" fill="#21466a" stroke="#e8c56a" stroke-width="2"/>
  <text x="655" y="171" font-size="11" fill="#e8c56a" text-anchor="middle">same hash in the</text>
  <text x="655" y="188" font-size="11" fill="#e8c56a" text-anchor="middle">live vectors.json?</text>

  <!-- yes: reuse; no: embed -->
  <g stroke="#68839d" stroke-width="1" fill="#21466a">
    <rect x="330" y="148" width="200" height="54" rx="3"/>
    <rect x="330" y="232" width="200" height="66" rx="3"/>
  </g>
  <text x="430" y="171" font-size="11" fill="#e8f1fa" text-anchor="middle">reuse the live vector</text>
  <text x="430" y="188" font-size="9" fill="#a7c0d9" text-anchor="middle">unchanged note, no call</text>
  <text x="430" y="252" font-size="11" fill="#e8f1fa" text-anchor="middle">Workers AI bge-m3</text>
  <text x="430" y="268" font-size="9" fill="#a7c0d9" text-anchor="middle">50 texts, 100,000 chars a call</text>
  <text x="430" y="282" font-size="9" fill="#a7c0d9" text-anchor="middle">refused call splits in two</text>
  <g stroke="#c3d7ea" stroke-width="1.5" fill="none" marker-end="url(#ar2)">
    <line x1="570" y1="175" x2="532" y2="175"/>
    <path d="M 655 202 V 265 H 532"/>
  </g>
  <text x="551" y="168" font-size="9" fill="#a7c0d9" text-anchor="middle">yes</text>
  <text x="664" y="236" font-size="9" fill="#a7c0d9">no</text>

  <!-- failure path -->
  <rect x="560" y="300" width="180" height="50" rx="3" fill="none" stroke="#68839d" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="650" y="320" font-size="9" fill="#a7c0d9" text-anchor="middle">call fails or no token:</text>
  <text x="650" y="335" font-size="9" fill="#a7c0d9" text-anchor="middle">keep live index, exit 0</text>
  <path d="M 500 298 V 325 H 558" fill="none" stroke="#68839d" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- outputs -->
  <rect x="20" y="148" width="270" height="150" rx="3" fill="#21466a" stroke="#68839d" stroke-width="1"/>
  <text x="34" y="172" font-size="11" fill="#e8f1fa">/qa/vectors.f32</text>
  <text x="34" y="189" font-size="9" fill="#a7c0d9">522 rows x 1,024 float32</text>
  <text x="34" y="203" font-size="9" fill="#a7c0d9">unit length, 2,138,112 bytes</text>
  <line x1="34" y1="220" x2="276" y2="220" stroke="#68839d" stroke-width="1"/>
  <text x="34" y="242" font-size="11" fill="#e8f1fa">/qa/vectors.json</text>
  <text x="34" y="259" font-size="9" fill="#a7c0d9">slug, url, title, lead, hash</text>
  <text x="34" y="273" font-size="9" fill="#a7c0d9">247,577 bytes</text>
  <g stroke="#c3d7ea" stroke-width="1.5" fill="none" marker-end="url(#ar2)">
    <line x1="330" y1="175" x2="292" y2="175"/>
    <line x1="330" y1="265" x2="292" y2="265"/>
  </g>

  <!-- ring 1 -->
  <text x="20" y="378" font-size="10" letter-spacing="1" fill="#6f8fb0">RING 1 PER NOTE, CAP 5</text>
  <g stroke="#68839d" stroke-width="1" fill="#21466a">
    <rect x="20" y="386" width="150" height="40" rx="3"/>
    <rect x="200" y="386" width="150" height="40" rx="3"/>
    <rect x="380" y="386" width="190" height="40" rx="3"/>
  </g>
  <text x="95" y="410" font-size="11" fill="#e8f1fa" text-anchor="middle">1. links</text>
  <text x="275" y="410" font-size="11" fill="#e8f1fa" text-anchor="middle">2. backlinks</text>
  <text x="475" y="410" font-size="11" fill="#e8f1fa" text-anchor="middle">3. nearest, cos 0.65+</text>
  <g stroke="#c3d7ea" stroke-width="1.5" fill="none" marker-end="url(#ar2)">
    <line x1="170" y1="406" x2="198" y2="406"/>
    <line x1="350" y1="406" x2="378" y2="406"/>
    <line x1="570" y1="406" x2="598" y2="406"/>
    <path d="M 250 298 V 360 H 475 V 384"/>
  </g>
  <text x="604" y="403" font-size="11" fill="#e8f1fa">/qa/&lt;slug&gt;.json</text>
  <text x="604" y="418" font-size="9" fill="#a7c0d9">read by Ask</text>
</svg>
