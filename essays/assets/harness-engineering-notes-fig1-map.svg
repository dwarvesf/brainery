<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 466" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Map of the nine harness engineering notes in four groups under one harness bar">
