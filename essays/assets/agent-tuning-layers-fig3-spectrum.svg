<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" style="width:100%;height:auto;max-width:760px;display:block" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <pattern id="grid3s" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#e8f1fa" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <marker id="arr3s" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c3d7ea"/>
    </marker>
  </defs>
  <rect width="760" height="380" fill="#12395f"/>
  <rect width="760" height="380" fill="url(#grid3s)"/>
  <rect x="0.5" y="0.5" width="759" height="379" fill="none" stroke="#68839d"/>
  <text x="14" y="24" font-size="10" letter-spacing="1.5" fill="#c3d7ea">FIG. 3 · AGENTIC OR NOT</text>
  <text x="746" y="24" font-size="10" letter-spacing="1.5" fill="#6f8fb0" text-anchor="end">WHO DECIDES THE NEXT STEP?</text>
  <line x1="0" y1="36" x2="760" y2="36" stroke="#385a7b"/>

  <!-- column 1: plain code -->
  <rect x="24" y="56" width="220" height="226" fill="#21466a" stroke="#68839d"/>
  <text x="40" y="80" font-size="11" letter-spacing="1.5" fill="#e8f1fa">PLAIN CODE</text>
  <text x="40" y="100" font-size="10" fill="#a7c0d9">code decides every step</text>
  <text x="40" y="116" font-size="10" fill="#a7c0d9">no model runs</text>
  <text x="40" y="132" font-size="10" fill="#a7c0d9">same input, same output</text>
  <line x1="40" y1="148" x2="228" y2="148" stroke="#385a7b"/>
  <text x="40" y="168" font-size="9" letter-spacing="1.5" fill="#6f8fb0">IN CIRCLE</text>
  <text x="40" y="188" font-size="10" fill="#e8f1fa">warmth score</text>
  <text x="40" y="206" font-size="10" fill="#e8f1fa">daily radar</text>
  <text x="40" y="224" font-size="10" fill="#e8f1fa">tier cadence (A = 30d)</text>
  <text x="40" y="242" font-size="10" fill="#e8f1fa">name -> candidates</text>

  <!-- column 2: model on a fixed path -->
  <rect x="270" y="56" width="220" height="226" fill="#21466a" stroke="#68839d"/>
  <text x="286" y="80" font-size="11" letter-spacing="1.5" fill="#e8f1fa">MODEL, FIXED PATH</text>
  <text x="286" y="100" font-size="10" fill="#a7c0d9">code decides the steps</text>
  <text x="286" y="116" font-size="10" fill="#a7c0d9">model fills one slot</text>
  <text x="286" y="132" font-size="10" fill="#a7c0d9">fixed output shape</text>
  <line x1="286" y1="148" x2="474" y2="148" stroke="#385a7b"/>
  <text x="286" y="168" font-size="9" letter-spacing="1.5" fill="#6f8fb0">IN CIRCLE</text>
  <text x="286" y="188" font-size="10" fill="#e8f1fa">note -> facts (extract)</text>
  <text x="286" y="206" font-size="10" fill="#e8f1fa">confirmed facts -> doc</text>
  <text x="286" y="224" font-size="9.5" fill="#a7c0d9">a.k.a. a workflow step</text>

  <!-- column 3: agent -->
  <rect x="516" y="56" width="220" height="226" fill="#21466a" stroke="#68839d"/>
  <text x="532" y="80" font-size="11" letter-spacing="1.5" fill="#e8f1fa">AGENT</text>
  <text x="532" y="100" font-size="10" fill="#a7c0d9">model picks the next tool</text>
  <text x="532" y="116" font-size="10" fill="#a7c0d9">model decides when to stop</text>
  <text x="532" y="132" font-size="10" fill="#a7c0d9">code runs the loop</text>
  <line x1="532" y1="148" x2="720" y2="148" stroke="#385a7b"/>
  <text x="532" y="168" font-size="9" letter-spacing="1.5" fill="#6f8fb0">IN CIRCLE</text>
  <text x="532" y="188" font-size="10" fill="#e8f1fa">investigate (dossier)</text>
  <text x="532" y="206" font-size="10" fill="#e8f1fa">Hermes chat + skills</text>

  <!-- the handover line -->
  <line x1="503" y1="46" x2="503" y2="292" stroke="#e8c56a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="503" y="306" font-size="9.5" letter-spacing="1" fill="#e8c56a" text-anchor="middle">control passes to the model here</text>

  <!-- bottom scale -->
  <line x1="40" y1="334" x2="716" y2="334" stroke="#c3d7ea" marker-end="url(#arr3s)"/>
  <text x="40" y="352" font-size="9.5" fill="#a7c0d9">predictable, testable, cheap</text>
  <text x="720" y="352" font-size="9.5" fill="#a7c0d9" text-anchor="end">handles open-ended asks, harder to test</text>
  <text x="380" y="370" font-size="9" letter-spacing="1" fill="#6f8fb0" text-anchor="middle">USE THE LEAST AGENCY THAT SOLVES THE TASK</text>
</svg>
