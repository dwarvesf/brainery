<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" style="width:100%;height:auto;max-width:760px;display:block" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <pattern id="grid1" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#e8f1fa" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <marker id="arr1" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c3d7ea"/>
    </marker>
  </defs>
  <rect width="760" height="380" fill="#12395f"/>
  <rect width="760" height="380" fill="url(#grid1)"/>
  <rect x="0.5" y="0.5" width="759" height="379" fill="none" stroke="#68839d"/>
  <text x="14" y="24" font-size="10" letter-spacing="1.5" fill="#c3d7ea">FIG. 1 · WHERE TO TUNE AN AGENT</text>
  <text x="746" y="24" font-size="10" letter-spacing="1.5" fill="#6f8fb0" text-anchor="end">TOP = CHEAP, HIGH PAYOFF</text>
  <line x1="0" y1="36" x2="760" y2="36" stroke="#385a7b"/>

  <line x1="40" y1="56" x2="40" y2="354" stroke="#c3d7ea" marker-end="url(#arr1)"/>
  <text transform="translate(24 205) rotate(-90)" font-size="9" letter-spacing="1.5" fill="#6f8fb0" text-anchor="middle">cost to change</text>

  <rect x="64" y="56" width="556" height="52" fill="#21466a" stroke="#68839d"/>
  <text x="80" y="78" font-size="10" fill="#6f8fb0">1</text>
  <text x="100" y="78" font-size="12" letter-spacing="1" fill="#e8f1fa">MCP tools</text>
  <text x="100" y="95" font-size="10" fill="#a7c0d9">names, descriptions, schemas, result size</text>
  <text x="604" y="78" font-size="9" letter-spacing="1" fill="#6f8fb0" text-anchor="end">you own it</text>

  <rect x="64" y="118" width="556" height="52" fill="#21466a" stroke="#68839d"/>
  <text x="80" y="140" font-size="10" fill="#6f8fb0">2</text>
  <text x="100" y="140" font-size="12" letter-spacing="1" fill="#e8f1fa">Skills</text>
  <text x="100" y="157" font-size="10" fill="#a7c0d9">when to call what, what to keep, what never to do</text>
  <text x="604" y="140" font-size="9" letter-spacing="1" fill="#6f8fb0" text-anchor="end">you own it</text>

  <rect x="64" y="180" width="556" height="52" fill="#21466a" stroke="#68839d"/>
  <text x="80" y="202" font-size="10" fill="#6f8fb0">3</text>
  <text x="100" y="202" font-size="12" letter-spacing="1" fill="#e8f1fa">Harness config</text>
  <text x="100" y="219" font-size="10" fill="#a7c0d9">compression, loop guards, model, toolsets</text>
  <text x="604" y="202" font-size="9" letter-spacing="1" fill="#6f8fb0" text-anchor="end">config file</text>

  <rect x="64" y="242" width="556" height="52" fill="#21466a" stroke="#68839d"/>
  <text x="80" y="264" font-size="10" fill="#6f8fb0">4</text>
  <text x="100" y="264" font-size="12" letter-spacing="1" fill="#e8f1fa">Engine patch</text>
  <text x="100" y="281" font-size="10" fill="#a7c0d9">change the loop code itself</text>
  <text x="604" y="264" font-size="9" letter-spacing="1" fill="#6f8fb0" text-anchor="end">patch stack</text>

  <rect x="64" y="304" width="556" height="52" fill="#21466a" stroke="#68839d"/>
  <text x="80" y="326" font-size="10" fill="#6f8fb0">5</text>
  <text x="100" y="326" font-size="12" letter-spacing="1" fill="#e8f1fa">Your own harness</text>
  <text x="100" y="343" font-size="10" fill="#a7c0d9">write the loop from scratch</text>
  <text x="604" y="326" font-size="9" letter-spacing="1" fill="#6f8fb0" text-anchor="end">to learn only</text>

  <path d="M 632 56 L 642 56 L 642 170 L 632 170" fill="none" stroke="#e8c56a" stroke-width="1.5"/>
  <text x="654" y="109" font-size="10" letter-spacing="1" fill="#e8c56a">tune here</text>
  <text x="654" y="123" font-size="10" letter-spacing="1" fill="#e8c56a">first</text>
