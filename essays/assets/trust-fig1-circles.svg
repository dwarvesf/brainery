<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" style="width:100%;height:auto;max-width:760px;display:block" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <pattern id="grid1t" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#e8f1fa" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="760" height="390" fill="#12395f"/>
  <rect width="760" height="390" fill="url(#grid1t)"/>
  <rect x="0.5" y="0.5" width="759" height="389" fill="none" stroke="#68839d"/>
  <text x="746" y="24" font-size="10" letter-spacing="1.5" fill="#6f8fb0" text-anchor="end">REACH GROWS OUTWARD</text>
  <line x1="0" y1="36" x2="760" y2="36" stroke="#385a7b"/>
  <g>
    <circle cx="200" cy="214" r="150" fill="#e8c56a" fill-opacity="0.10" stroke="#e8c56a" stroke-width="2"/>
  </g>
  <g>
    <circle cx="200" cy="214" r="106" fill="#21466a" fill-opacity="0.55" stroke="#68839d" stroke-width="1"/>
  </g>
  <g>
    <circle cx="200" cy="214" r="62" fill="#21466a" stroke="#68839d" stroke-width="1"/>
  </g>
  <circle cx="200" cy="214" r="24" fill="#12395f" stroke="#c3d7ea" stroke-width="1"/>
  <text x="200" y="218" font-size="10" fill="#e8f1fa" text-anchor="middle">you</text>
  <text x="200" y="90" font-size="9.5" letter-spacing="1" fill="#e8c56a" text-anchor="middle">COMPANY</text>
  <text x="200" y="134" font-size="9.5" letter-spacing="1" fill="#c3d7ea" text-anchor="middle">ORGANISATION</text>
  <text x="200" y="176" font-size="9.5" letter-spacing="1" fill="#c3d7ea" text-anchor="middle">TEAM</text>
  <g>
    <polyline points="278.2,86 372,86 392,80" fill="none" stroke="#e8c56a" stroke-width="1"/>
    <text x="400" y="84" font-size="10.5" letter-spacing="1" fill="#e8c56a">COMPANY CIRCLE</text>
    <text x="400" y="100" font-size="9.5" fill="#c3d7ea">the people we call first in a crisis</text>
    <text x="400" y="114" font-size="9" fill="#a7c0d9">high-stakes work, closer scrutiny, on call</text>
  </g>
  <g>
    <polyline points="264.7,130 372,130 392,160" fill="none" stroke="#68839d" stroke-width="1"/>
    <text x="400" y="164" font-size="10.5" letter-spacing="1" fill="#e8f1fa">ORGANISATION CIRCLE</text>
    <text x="400" y="180" font-size="9.5" fill="#c3d7ea">other managers learn your name</text>
    <text x="400" y="194" font-size="9" fill="#a7c0d9">invited to planning and strategy talks</text>
  </g>
  <g>
    <polyline points="247.4,174 372,174 392,240" fill="none" stroke="#68839d" stroke-width="1"/>
    <text x="400" y="244" font-size="10.5" letter-spacing="1" fill="#e8f1fa">TEAM CIRCLE</text>
    <text x="400" y="260" font-size="9.5" fill="#c3d7ea">reliable work, teammates helped to succeed</text>
    <text x="400" y="274" font-size="9" fill="#a7c0d9">your manager thinks of you for the critical task</text>
  </g>
  <text x="400" y="318" font-size="9.5" fill="#c3d7ea">Each circle vouches for the next one out.</text>
  <text x="14" y="376" font-size="9" fill="#6f8fb0">Concentric reach of trust at Dwarves. The highlight marks the circle people are called from.</text>
</svg>
