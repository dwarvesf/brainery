<figure class="fig"><div class="fig-body">
<svg role="group" aria-label="Fig. 3: technical interview score weights before and from February 2026" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" style="width:100%;height:auto;max-width:760px;display:block" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <pattern id="grid2a" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#e8f1fa" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="hatch2a" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#385a7b" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="760" height="300" fill="#12395f"/>
  <rect width="760" height="300" fill="url(#grid2a)"/>
  <rect x="0.5" y="0.5" width="759" height="299" fill="none" stroke="#68839d"/>
  <text x="14" y="24" font-size="10" letter-spacing="1.5" fill="#c3d7ea">FIG. 3 · WHAT THE INTERVIEW SCORES</text>
  <text x="746" y="24" font-size="10" letter-spacing="1.5" fill="#6f8fb0" text-anchor="end">SHARE OF TECHNICAL SCORE</text>
  <line x1="0" y1="36" x2="760" y2="36" stroke="#385a7b"/>

  <text x="14" y="70" font-size="9.5" letter-spacing="1" fill="#a7c0d9">UNTIL FEB 2026</text>
  <text x="14" y="84" font-size="9" fill="#6f8fb0">40 min of puzzles</text>
  <text x="14" y="174" font-size="9.5" letter-spacing="1" fill="#a7c0d9">FROM FEB 2026</text>
  <text x="14" y="188" font-size="9" fill="#6f8fb0">60 min, 3 sections</text>

  <g data-group="puzzle" data-tip="Before Feb 2026: 40 minutes of algorithm problems under time pressure carried 60% of the technical interview score.">
    <rect x="150" y="84" width="336" height="52" fill="#e8c56a" stroke="#e8c56a" data-animate="grow" data-step="0"/>
    <text x="318.0" y="104" font-size="9" fill="#12395f" text-anchor="middle">algorithm problems</text>
    <text x="318.0" y="122" font-size="13" fill="#12395f" text-anchor="middle">60%</text>
  </g>
  <g data-group="old" data-tip="The split of the other 40% was not recorded.">
    <rect x="486" y="84" width="224" height="52" fill="url(#hatch2a)" stroke="#68839d" data-animate="grow" data-step="1"/>
    <text x="598.0" y="104" font-size="9" fill="#a7c0d9" text-anchor="middle">everything else</text>
    <text x="598.0" y="122" font-size="13" fill="#a7c0d9" text-anchor="middle">40%</text>
  </g>
  <g data-group="puzzle" data-tip="From Feb 2026: raw coding ability, observed during section A, carries 15% of the score.">
    <rect x="150" y="188" width="84" height="52" fill="#e8c56a" stroke="#e8c56a" data-animate="grow" data-step="2"/>
    <text x="192.0" y="208" font-size="9" fill="#12395f" text-anchor="middle">raw coding</text>
    <text x="192.0" y="226" font-size="13" fill="#12395f" text-anchor="middle">15%</text>
  </g>
  <g data-group="new" data-tip="Section A, 25 minutes: a realistic problem with AI tools on. Scored on the quality of the AI interaction and the judgment on its output, not on completeness.">
    <rect x="234" y="188" width="140" height="52" fill="#21466a" stroke="#68839d" data-animate="grow" data-step="3"/>
    <text x="304.0" y="208" font-size="9" fill="#e8f1fa" text-anchor="middle">AI-augmented</text>
    <text x="304.0" y="226" font-size="13" fill="#e8f1fa" text-anchor="middle">25%</text>
  </g>
  <g data-group="new" data-tip="Section B, 20 minutes: architecture and tradeoff discussion.">
    <rect x="374" y="188" width="140" height="52" fill="#21466a" stroke="#68839d" data-animate="grow" data-step="4"/>
    <text x="444.0" y="208" font-size="9" fill="#e8f1fa" text-anchor="middle">architecture</text>
    <text x="444.0" y="226" font-size="13" fill="#e8f1fa" text-anchor="middle">25%</text>
  </g>
  <g data-group="new" data-tip="Domain knowledge, observed during section B, carries 10%.">
    <rect x="514" y="188" width="56" height="52" fill="#21466a" stroke="#68839d" data-animate="grow" data-step="5"/>
    <text x="542.0" y="208" font-size="9" fill="#e8f1fa" text-anchor="middle">domain</text>
    <text x="542.0" y="226" font-size="13" fill="#e8f1fa" text-anchor="middle">10%</text>
  </g>
  <g data-group="new" data-tip="Section C, 15 minutes: communication and collaboration, such as explaining the decision to a product manager.">
    <rect x="570" y="188" width="140" height="52" fill="#21466a" stroke="#68839d" data-animate="grow" data-step="6"/>
    <text x="640.0" y="208" font-size="9" fill="#e8f1fa" text-anchor="middle">communication</text>
    <text x="640.0" y="226" font-size="13" fill="#e8f1fa" text-anchor="middle">25%</text>
  </g>

  <g>
    <line x1="318" y1="142" x2="318" y2="176" stroke="#c3d7ea" stroke-width="1"/>
    <text x="330" y="164" font-size="10.5" fill="#e8c56a">algorithm weight: 60% to 15%</text>
  </g>

  <text x="150" y="258" font-size="9" fill="#6f8fb0">A is 25 min, B is 20 min, C is 15 min. Amber marks the algorithm and raw-coding share.</text>
  <text x="14" y="284" font-size="9" fill="#6f8fb0">source: interview guide and hiring note, Feb 2026. The old split of the other 40% is not recorded.</text>
</svg>
<div data-fk-controls hidden>
<span data-fk-toggle="puzzle" data-fk-label="Show the puzzle share" data-fk-note="algorithm weight fell from 60% to 15%"></span>
</div>
</div></figure>
