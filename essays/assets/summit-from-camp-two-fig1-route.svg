<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" style="width:100%;height:auto;max-width:760px;display:block">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#385a7b" stroke-width="0.5" opacity="0.5"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c3d7ea"/>
    </marker>
  </defs>
  <rect width="760" height="420" fill="#12395f"/>
  <rect width="760" height="420" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="759" height="419" fill="none" stroke="#68839d"/>

  <text x="20" y="24" fill="#e8f1fa" font-size="10" letter-spacing="2">FIG. 1 · THE ROUTE</text>
  <text x="740" y="24" fill="#a7c0d9" font-size="10" letter-spacing="2" text-anchor="end">FOUR CAMPS, ONE SUMMIT, ONE MARKER</text>
  <line x1="20" y1="36" x2="740" y2="36" stroke="#68839d" stroke-width="1"/>

  <!-- mountain profile -->
  <path d="M 40 380 L 150 330 L 230 300 L 310 240 L 400 200 L 480 140 L 560 90 L 620 60 L 660 100 L 720 380 Z" fill="#21466a" stroke="#68839d" stroke-width="1"/>
  <path d="M 40 380 L 150 330 L 230 300 L 310 240 L 400 200 L 480 140 L 560 90 L 620 60" fill="none" stroke="#c3d7ea" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- camps -->
  <g fill="#c3d7ea" font-size="11">
    <circle cx="150" cy="330" r="4" fill="#c3d7ea"/>
    <text x="150" y="356" text-anchor="middle">CAMP 1</text>
    <text x="150" y="370" text-anchor="middle" fill="#a7c0d9" font-size="10">generation</text>
    <text x="150" y="384" text-anchor="middle" fill="#6f8fb0" font-size="9">passed, everyone is here</text>

    <circle cx="310" cy="240" r="7" fill="#e8c56a"/>
    <text x="310" y="212" text-anchor="middle" fill="#e8c56a" font-size="11">WE ARE HERE</text>
    <text x="310" y="266" text-anchor="middle">CAMP 2</text>
    <text x="310" y="280" text-anchor="middle" fill="#a7c0d9" font-size="10">the harness</text>
    <text x="310" y="294" text-anchor="middle" fill="#6f8fb0" font-size="9">hooks, routing, gates</text>

    <circle cx="480" cy="140" r="4" fill="#c3d7ea"/>
    <text x="480" y="166" text-anchor="middle">CAMP 3</text>
    <text x="480" y="180" text-anchor="middle" fill="#a7c0d9" font-size="10">verification at</text>
    <text x="480" y="192" text-anchor="middle" fill="#a7c0d9" font-size="10">generation speed</text>

    <circle cx="560" cy="90" r="4" fill="#c3d7ea"/>
    <text x="536" y="78" text-anchor="end">CAMP 4</text>
    <text x="536" y="92" text-anchor="end" fill="#a7c0d9" font-size="10">the harness edits itself</text>

    <circle cx="620" cy="60" r="4" fill="#c3d7ea"/>
    <text x="640" y="56" fill="#e8f1fa">SUMMIT</text>
    <text x="640" y="70" fill="#a7c0d9" font-size="10">judgment inside,</text>
    <text x="640" y="82" fill="#a7c0d9" font-size="10">trust outside</text>
  </g>

  <!-- the false summit -->
  <path d="M 200 300 L 240 250 L 265 290" fill="none" stroke="#6f8fb0" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="226" y="242" fill="#6f8fb0" font-size="9" text-anchor="middle">false summit: "10x"</text>

  <!-- footer -->
  <text x="20" y="404" fill="#6f8fb0" font-size="9">Dwarves, September 2026. Camps are the report's four findings in order of dependence; the marker is where our own audit put us.</text>
</svg>
