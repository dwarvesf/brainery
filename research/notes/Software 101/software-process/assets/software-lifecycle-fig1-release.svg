<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 384" style="width:100%;height:auto;max-width:760px;display:block" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <pattern id="gridl1" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#e8f1fa" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <marker id="arl1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c3d7ea"/></marker>
    <marker id="aml1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e8c56a"/></marker>
  </defs>
  <rect width="760" height="384" fill="#12395f"/>
  <rect width="760" height="384" fill="url(#gridl1)"/>
  <rect x="0.5" y="0.5" width="759" height="383" fill="none" stroke="#68839d"/>
  <text x="14" y="24" font-size="10" letter-spacing="1.5" fill="#c3d7ea">FIG. 1 · WHEN THE CUSTOMER GETS THE SOFTWARE</text>
  <text x="746" y="24" font-size="10" letter-spacing="1.5" fill="#6f8fb0" text-anchor="end">TIME RUNS LEFT TO RIGHT, ILLUSTRATIVE</text>
  <line x1="0" y1="36" x2="760" y2="36" stroke="#385a7b"/>
<text x="24" y="84" font-size="12" fill="#e8f1fa" font-weight="bold">WATERFALL</text>
<text x="24" y="106" font-size="11" fill="#a7c0d9">Finish everything,</text>
<text x="24" y="122" font-size="11" fill="#a7c0d9">then release all at once.</text>
<rect x="240" y="66" width="100" height="24" fill="#21466a" stroke="#68839d" stroke-width="1"/>
<text x="290" y="82" font-size="10" fill="#e8f1fa" text-anchor="middle">phase 1</text>
<rect x="344" y="94" width="100" height="24" fill="#21466a" stroke="#68839d" stroke-width="1"/>
<text x="394" y="110" font-size="10" fill="#e8f1fa" text-anchor="middle">phase 2</text>
<rect x="448" y="122" width="100" height="24" fill="#21466a" stroke="#68839d" stroke-width="1"/>
<text x="498" y="138" font-size="10" fill="#e8f1fa" text-anchor="middle">phase 3</text>
<rect x="552" y="150" width="100" height="24" fill="#21466a" stroke="#68839d" stroke-width="1"/>
<text x="602" y="166" font-size="10" fill="#e8f1fa" text-anchor="middle">phase 4</text>
<line x1="654" y1="162" x2="676" y2="162" stroke="#c3d7ea" stroke-width="2" marker-end="url(#arl1)"/>
<polygon points="692,150 704,162 692,174 680,162" fill="#e8c56a"/>
<text x="692" y="194" font-size="11" fill="#e8c56a" text-anchor="middle">one release</text>
<text x="470" y="82" font-size="10.5" fill="#a7c0d9">Each phase starts when the</text>
<text x="470" y="97" font-size="10.5" fill="#a7c0d9">last one is done. None overlap.</text>
<text x="240" y="196" font-size="10.5" fill="#a7c0d9">risk: a changed requirement means redoing work</text>
<line x1="24" y1="218" x2="736" y2="218" stroke="#385a7b"/>
<text x="24" y="256" font-size="12" fill="#e8f1fa" font-weight="bold">ITERATIVE</text>
<text x="24" y="278" font-size="11" fill="#a7c0d9">Deliver fast, in</text>
<text x="24" y="294" font-size="11" fill="#a7c0d9">small parts.</text>
<rect x="240" y="250" width="90" height="28" fill="#21466a" stroke="#68839d" stroke-width="1"/>
<text x="285" y="268" font-size="10" fill="#e8f1fa" text-anchor="middle">cycle</text>
<line x1="330" y1="264" x2="341" y2="264" stroke="#c3d7ea" stroke-width="2"/>
<circle cx="348" cy="264" r="6" fill="#c3d7ea"/>
<rect x="364" y="250" width="90" height="28" fill="#21466a" stroke="#68839d" stroke-width="1"/>
<text x="409" y="268" font-size="10" fill="#e8f1fa" text-anchor="middle">cycle</text>
<line x1="454" y1="264" x2="465" y2="264" stroke="#c3d7ea" stroke-width="2"/>
<circle cx="472" cy="264" r="6" fill="#c3d7ea"/>
<rect x="488" y="250" width="90" height="28" fill="#21466a" stroke="#68839d" stroke-width="1"/>
<text x="533" y="268" font-size="10" fill="#e8f1fa" text-anchor="middle">cycle</text>
<line x1="578" y1="264" x2="589" y2="264" stroke="#c3d7ea" stroke-width="2"/>
<circle cx="596" cy="264" r="6" fill="#c3d7ea"/>
<rect x="612" y="250" width="90" height="28" fill="#21466a" stroke="#68839d" stroke-width="1"/>
<text x="657" y="268" font-size="10" fill="#e8f1fa" text-anchor="middle">cycle</text>
<line x1="702" y1="264" x2="713" y2="264" stroke="#c3d7ea" stroke-width="2"/>
<circle cx="720" cy="264" r="6" fill="#c3d7ea"/>
<text x="240" y="308" font-size="11" fill="#c3d7ea">small releases, used as customers need them</text>
<text x="240" y="352" font-size="10.5" fill="#a7c0d9">risk: too reactive, and many changes add complexity</text>
</svg>
