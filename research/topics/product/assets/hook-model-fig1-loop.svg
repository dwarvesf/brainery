<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" style="width:100%;height:auto;max-width:760px;display:block" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <pattern id="gridh1" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#e8f1fa" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <marker id="arh1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c3d7ea"/></marker>
    <marker id="amh1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e8c56a"/></marker>
  </defs>
  <rect width="760" height="400" fill="#12395f"/>
  <rect width="760" height="400" fill="url(#gridh1)"/>
  <rect x="0.5" y="0.5" width="759" height="399" fill="none" stroke="#68839d"/>
  <text x="14" y="24" font-size="10" letter-spacing="1.5" fill="#c3d7ea">FIG. 1 · THE HOOK MODEL, ONE LAP</text>
  <line x1="0" y1="36" x2="760" y2="36" stroke="#385a7b"/>
<g>
  <rect x="30" y="50" width="330" height="120" fill="#21466a" stroke="#68839d" stroke-width="1"/>
  <text x="46" y="78" font-size="14" fill="#6f8fb0">1</text>
  <text x="70" y="78" font-size="11" fill="#e8f1fa" font-weight="bold" letter-spacing="1.5">TRIGGER</text>
  <text x="46" y="102" font-size="11" fill="#e8f1fa">Prompts the user to act.</text>
  <text x="46" y="119" font-size="11" fill="#a7c0d9">External: paid, earned, relationship, owned</text>
  <text x="46" y="136" font-size="11" fill="#a7c0d9">Internal: a feeling like boredom or FOMO</text>
</g>
<g>
  <rect x="400" y="50" width="330" height="120" fill="#21466a" stroke="#68839d" stroke-width="1"/>
  <text x="416" y="78" font-size="14" fill="#6f8fb0">2</text>
  <text x="440" y="78" font-size="11" fill="#e8f1fa" font-weight="bold" letter-spacing="1.5">ACTION</text>
  <text x="416" y="102" font-size="11" fill="#e8f1fa">What the user does expecting a reward.</text>
  <text x="416" y="119" font-size="11" fill="#a7c0d9">Motivation: how much they want it</text>
  <text x="416" y="136" font-size="11" fill="#a7c0d9">Ability: is anything in the way?</text>
  <text x="416" y="153" font-size="11" fill="#a7c0d9">Simplicity: how many steps it takes</text>
</g>
<g>
  <rect x="400" y="218" width="330" height="120" fill="#21466a" stroke="#68839d" stroke-width="1"/>
  <text x="416" y="246" font-size="14" fill="#6f8fb0">3</text>
  <text x="440" y="246" font-size="11" fill="#e8f1fa" font-weight="bold" letter-spacing="1.5">VARIABLE REWARD</text>
  <text x="416" y="270" font-size="11" fill="#e8f1fa">The value users get on each return.</text>
  <text x="416" y="287" font-size="11" fill="#a7c0d9">A predictable reward creates no desire.</text>
  <text x="416" y="304" font-size="11" fill="#a7c0d9">Not knowing what is next draws them back.</text>
</g>
<g>
  <rect x="30" y="218" width="330" height="120" fill="#21466a" stroke="#68839d" stroke-width="1"/>
  <text x="46" y="246" font-size="14" fill="#6f8fb0">4</text>
  <text x="70" y="246" font-size="11" fill="#e8f1fa" font-weight="bold" letter-spacing="1.5">INVESTMENT</text>
  <text x="46" y="270" font-size="11" fill="#e8f1fa">Time, data, effort, social capital, money</text>
  <text x="46" y="287" font-size="11" fill="#a7c0d9">Makes the service better for the next pass:</text>
  <text x="46" y="304" font-size="11" fill="#a7c0d9">invite friends, state preferences,</text>
  <text x="46" y="321" font-size="11" fill="#a7c0d9">build virtual assets, learn features</text>
</g>
<line x1="362" y1="110" x2="398" y2="110" stroke="#c3d7ea" stroke-width="2" marker-end="url(#arh1)"/>
<line x1="565" y1="172" x2="565" y2="216" stroke="#c3d7ea" stroke-width="2" marker-end="url(#arh1)"/>
<line x1="398" y1="278" x2="362" y2="278" stroke="#c3d7ea" stroke-width="2" marker-end="url(#arh1)"/>
<line x1="195" y1="216" x2="195" y2="172" stroke="#e8c56a" stroke-width="2" marker-end="url(#amh1)"/>
<text x="209" y="198" font-size="11" fill="#e8c56a">investment loads the next trigger</text>
<text x="30" y="366" font-size="11" fill="#a7c0d9">Each commitment can make the next trigger more engaging, the action easier</text>
<text x="30" y="382" font-size="11" fill="#a7c0d9">and the reward more exciting.</text>
<text x="730" y="382" font-size="10" fill="#6f8fb0" text-anchor="end">after Nir Eyal, Hooked</text>
</svg>
