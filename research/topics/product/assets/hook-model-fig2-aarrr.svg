<text x="24" y="270" font-size="10" fill="#c3d7ea" letter-spacing="1.5">AARRR</text>
<text x="24" y="292" font-size="11" fill="#e8f1fa">Strategy to build the user journey.</text>
<text x="24" y="310" font-size="11" fill="#a7c0d9">Focus: bring in new users.</text>
<text x="24" y="328" font-size="11" fill="#a7c0d9">The action is external: it exposes the</text>
<text x="24" y="346" font-size="11" fill="#a7c0d9">brand to potential new users.</text>
<text x="396" y="270" font-size="10" fill="#c3d7ea" letter-spacing="1.5">HOOK MODEL</text>
<text x="396" y="292" font-size="11" fill="#e8f1fa">Process to create a habitual product.</text>
<text x="396" y="310" font-size="11" fill="#a7c0d9">Focus: keep current customers using it.</text>
<text x="396" y="328" font-size="11" fill="#a7c0d9">The action is internal: it builds the habit</text>
<text x="396" y="346" font-size="11" fill="#a7c0d9">and improves the product itself.</text>
<text x="24" y="374" font-size="11" fill="#a7c0d9">Their end goals differ, and both serve product growth.</text>
<text x="736" y="374" font-size="10" fill="#6f8fb0" text-anchor="end">after Nir Eyal, Hooked</text>
