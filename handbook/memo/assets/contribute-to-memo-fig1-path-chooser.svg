  <text x="24" y="408" font-size="10" letter-spacing="1.5" fill="#6f8fb0">AGENT SKILL FOR EACH PATH</text>
  <rect x="24" y="420" width="224" height="46" fill="#21466a" stroke="#68839d"/>
  <text x="136.0" y="439.0" font-size="12" fill="#e8f1fa" text-anchor="middle">contribute-skill.md</text>
  <text x="136.0" y="455.0" font-size="10" fill="#a7c0d9" text-anchor="middle">branch mode: write access</text>
  <rect x="268" y="420" width="224" height="46" fill="#21466a" stroke="#68839d"/>
  <text x="380.0" y="439.0" font-size="12" fill="#e8f1fa" text-anchor="middle">contribute-skill.md</text>
  <text x="380.0" y="455.0" font-size="10" fill="#a7c0d9" text-anchor="middle">fork mode: no write access</text>
  <rect x="512" y="420" width="224" height="46" fill="#21466a" stroke="#68839d"/>
  <text x="624.0" y="439.0" font-size="12" fill="#e8f1fa" text-anchor="middle">skill.md</text>
