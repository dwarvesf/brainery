  <rect x="548" y="248" width="188" height="50" fill="#21466a" stroke="#68839d"/>
  <text x="642.0" y="269.0" font-size="13" fill="#e8f1fa" text-anchor="middle">Fork PR, or email</text>
  <text x="642.0" y="285.0" font-size="10" fill="#a7c0d9" text-anchor="middle">draft to team@d.foundation</text>
  <rect x="548" y="312" width="188" height="50" fill="#21466a" stroke="#68839d"/>
  <text x="642.0" y="333.0" font-size="13" fill="#e8f1fa" text-anchor="middle">Guest writer flow</text>
  <text x="642.0" y="349.0" font-size="10" fill="#a7c0d9" text-anchor="middle">domain proof, approval</text>
