  <text x="746" y="24" font-size="10" letter-spacing="1.5" fill="#6f8fb0" text-anchor="end">FIND YOURSELF, FOLLOW THE BRANCH</text>
  <line x1="0" y1="36" x2="760" y2="36" stroke="#385a7b"/>
  <rect x="24" y="196" width="140" height="58" fill="#21466a" stroke="#e8c56a" stroke-width="2"/>
  <text x="94.0" y="219.5" font-size="16" letter-spacing="2" fill="#e8c56a" text-anchor="middle">WHO ARE</text>
