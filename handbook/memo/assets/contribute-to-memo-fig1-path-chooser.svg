<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 482" role="img" aria-label="Path chooser. Who are you? A member, meaning current Dwarves staff or contractor, asks whether they have write access: yes means a branch and pull request, no means a fork and pull request. A fellow, meaning alumni, asks whether they own a blog: yes means the guest writer flow, linked to their member page, no means a fork pull request or an email draft to team@d.foundation. A guest writer, meaning an outsider with a blog domain, uses the guest writer flow with domain proof and approval. The agent skills are contribute-skill.md in branch mode, contribute-skill.md in fork mode, and skill.md." style="width:100%;height:auto;max-width:760px;display:block" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <pattern id="grid1" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#e8f1fa" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <marker id="arr1" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c3d7ea"/>
    </marker>
    <marker id="arra1" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#e8c56a"/>
    </marker>
  </defs>
